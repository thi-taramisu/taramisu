x-postgres: &postgres
  image: postgres:17-alpine
  environment:
    POSTGRES_USER: taramisu
    POSTGRES_PASSWORD: taramisu
    POSTGRES_DB: taramisu
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U taramisu"]
    interval: 2s
    retries: 20

services:
  frontend:
    build: ./frontend/
    container_name: frontend
    ports:
      - "5173:5173"
    environment:
      BACKEND_HOST: "api"
      BACKEND_PORT: 5432
    networks:
      - app_network
  db:
    <<: *postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    container_name: db
    networks:
      - app_network

  dev-db:
    <<: *postgres
    profiles: [tools]
    networks:
      - app_network

  migrate:
    image: arigaio/atlas:1.3.0
    container_name: migrate
    working_dir: /app
    volumes:
      - ./backend/:/app
    environment:
      DATABASE_URL: postgres://taramisu:taramisu@db:5432/taramisu?sslmode=disable
    command: ["migrate", "apply", "--env", "local"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  api:
    build: ./backend/
    container_name: api
    environment:
      DATABASE_URL: postgres://taramisu:taramisu@db:5432/taramisu?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge