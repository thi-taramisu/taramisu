services:
  frontend:
    # Server: pulled from GHCR (taramisu-ctl.sh). Local: built from source (dev.sh uses --build).
    image: ghcr.io/thi-taramisu/taramisu-frontend:${FRONTEND_IMAGE_TAG:-latest}
    build: ../frontend
    # Only documents the port; the proxy reaches the frontend through the proxy network.
    expose:
      - 80
    networks: [proxy]
