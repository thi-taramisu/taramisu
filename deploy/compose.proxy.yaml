services:
  proxy:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ../proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Make sure to generate these (proxy/generate_keys.sh), otherwise the proxy will throw an error
      - ../proxy/cert.pem:/etc/ssl/certs/
      - ../proxy/key.pem:/etc/ssl/private/
    depends_on:
      - api
      - frontend
      - docs
    networks:
      - default
      - taramisu-proxy
