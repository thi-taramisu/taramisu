name: taramisu

include:
  - ./compose.storage.yaml
  - ./compose.backend.yaml
  - ./compose.iam.yaml
  - ./compose.frontend.yaml
  - ./compose.proxy.yaml
  - ./compose.docs.yaml
  - ./compose.llm.yaml

# Network segmentation from the architecture overview (#87).
# Only edge has published ports and internet access; the others are internal.
# Containers only in internal networks cannot publish ports, see compose.dev.yaml.
networks:
  edge:
  proxy:
    internal: true
  app-db:
    internal: true
  iam-db:
    internal: true
  storage:
    internal: true
  llm:
    internal: true
  # Only the LLM service joins this network, so it is the one container that reaches the model API (#229).
  # Not edge: the proxy is there, and it must not reach the service that holds the API key.
  llm-egress:
