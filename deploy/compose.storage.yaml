x-storage-bootstrap: &storage-bootstrap
  build: ../storage
  networks: [taramisu-storage]
  # Validate at startup so down works with older .env files.
  environment:
    S3_ROOT_ACCESS_KEY: ${S3_ROOT_ACCESS_KEY:-}
    S3_ROOT_SECRET_KEY: ${S3_ROOT_SECRET_KEY:-}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    S3_BUCKET: ${S3_BUCKET:-taramisu-uploads}

services:
  storage-config:
    <<: *storage-bootstrap
    command: [config]
    volumes:
      - storage_config:/config

  storage:
    image: chrislusf/seaweedfs:4.51
    networks: [taramisu-storage]
    restart: unless-stopped
    command:
      - server
      - -ip=127.0.0.1
      - -ip.bind=127.0.0.1
      - -s3.ip.bind=0.0.0.0
      - -master.telemetry=false
      - -dir=/data
      - -master.volumeSizeLimitMB=1024
      - -volume.max=32
      - -filer
      - -s3
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - storage_data:/data
      - storage_config:/etc/seaweedfs:ro
      - ../storage/filer.toml:/etc/seaweedfs/filer.toml:ro
    depends_on:
      storage-config:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:9333/cluster/status | grep -q '"IsLeader":true'
      interval: 5s
      timeout: 3s
      retries: 30
    stop_grace_period: 30s

  storage-init:
    <<: *storage-bootstrap
    command: [bucket]
    depends_on:
      storage:
        condition: service_healthy

networks:
  taramisu-storage:
    internal: true

volumes:
  storage_data:
    name: ${COMPOSE_PROJECT_NAME}-storage_data
  storage_config:
    name: ${COMPOSE_PROJECT_NAME}-storage_config
