x-postgres: &postgres
  image: postgres:17-alpine
  environment:
    POSTGRES_USER: taramisu
    POSTGRES_PASSWORD: taramisu
    POSTGRES_DB: taramisu
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U taramisu"]
    interval: 2s
    retries: 20

services:
  db:
    <<: *postgres
    networks: [backend]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  dev-db:
    <<: *postgres
    networks: [backend]
    profiles: [tools]

  pgadmin:
    image: dpage/pgadmin4:9
    networks: [backend]
    profiles: [tools]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: taramisu
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    configs:
      - source: pgadmin_servers
        target: /pgadmin4/servers.json
      - source: pgadmin_pgpass
        target: /pgpass
        uid: "5050"
        gid: "5050"
        mode: 0600
    depends_on:
      db:
        condition: service_healthy

  migrate:
    image: arigaio/atlas:1.3.0
    networks: [backend]
    working_dir: /app
    volumes:
      - ../backend:/app
    environment:
      DATABASE_URL: postgres://taramisu:taramisu@db:5432/taramisu?sslmode=disable
    command: ["migrate", "apply", "--env", "local"]
    depends_on:
      db:
        condition: service_healthy

  api:
    networks: [default, backend, auth]
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgres://taramisu:taramisu@db:5432/taramisu?sslmode=disable
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      APP_URL: ${APP_URL:-http://localhost}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://authentik.localhost:9000/application/o/taramisu/}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-taramisu}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET in iam/.env; run make -C deploy init}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      authentik-server:
        condition: service_healthy

configs:
  pgadmin_servers:
    content: |
      {"Servers": {"1": {"Name": "taramisu (compose)", "Group": "Servers", "Host": "db", "Port": 5432, "MaintenanceDB": "taramisu", "Username": "taramisu", "SSLMode": "prefer", "PassFile": "/pgpass"}}}
  pgadmin_pgpass:
    content: |
      db:5432:taramisu:taramisu:taramisu

# Keep the former default project's data; -p isolates volumes for other stacks.
volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME}-backend_postgres_data
  pgadmin_data:
    name: ${COMPOSE_PROJECT_NAME}-backend_pgadmin_data
