x-postgres: &postgres
  image: postgres:17-alpine
  environment:
    POSTGRES_USER: taramisu
    POSTGRES_PASSWORD: taramisu
    POSTGRES_DB: taramisu
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U taramisu"]
    interval: 2s
    retries: 20

services:
  db:
    <<: *postgres
    networks: [app-db]
    volumes:
      - postgres_data:/var/lib/postgresql/data

  dev-db:
    <<: *postgres
    networks: [app-db]
    profiles: [tools]

  pgadmin:
    image: dpage/pgadmin4:9
    networks: [app-db]
    profiles: [tools]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: taramisu
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    configs:
      - source: pgadmin_servers
        target: /pgadmin4/servers.json
      - source: pgadmin_pgpass
        target: /pgpass
        uid: "5050"
        gid: "5050"
        mode: 0600
    depends_on:
      db:
        condition: service_healthy

  migrate:
    image: arigaio/atlas:1.3.0
    networks: [app-db]
    working_dir: /app
    volumes:
      - ../backend:/app
    environment:
      DATABASE_URL: postgres://taramisu:taramisu@db:5432/taramisu?sslmode=disable
    command: ["migrate", "apply", "--env", "local"]
    depends_on:
      db:
        condition: service_healthy

  sentry-ingest:
    image: nginx:1.28-alpine
    networks: [edge, proxy]
    environment:
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - ../proxy/25-sentry-ingest.sh:/docker-entrypoint.d/25-sentry-ingest.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S --spider http://127.0.0.1:8081/ 2>&1 | grep -q '404'"]
      interval: 2s
      timeout: 2s
      retries: 20

  api:
    networks: [proxy, app-db]
    image: ghcr.io/thi-taramisu/taramisu-api:${TARAMISU_VERSION:-latest}
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgres://taramisu:taramisu@db:5432/taramisu?sslmode=disable
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TUNNEL_URL: http://sentry-ingest:8081
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      APP_URL: ${APP_URL:-http://localhost}
      OIDC_ISSUER: ${OIDC_ISSUER:-${APP_URL:-http://localhost}/auth/application/o/taramisu/}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://authentik-server:9000/auth/application/o/taramisu/jwks/}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-taramisu}
      AUTHENTIK_API_URL: http://authentik-server:9000/auth
      AUTHENTIK_API_TOKEN: ${AUTHENTIK_API_TOKEN:?Set AUTHENTIK_API_TOKEN in iam/.env; see iam/.env.example}
    depends_on:
      migrate:
        condition: service_completed_successfully
      # Starts before the API and stops after its final flush. No host port is published.
      sentry-ingest:
        condition: service_healthy
    # Allow HTTP draining (8s), pool closure (1s), and Sentry flushing (5s), plus a margin.
    stop_grace_period: 15s

configs:
  pgadmin_servers:
    content: |
      {"Servers": {"1": {"Name": "taramisu (compose)", "Group": "Servers", "Host": "db", "Port": 5432, "MaintenanceDB": "taramisu", "Username": "taramisu", "SSLMode": "prefer", "PassFile": "/pgpass"}}}
  pgadmin_pgpass:
    content: |
      db:5432:taramisu:taramisu:taramisu

# Keep the former default project's data; -p isolates volumes for other stacks.
volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME}-backend_postgres_data
  pgadmin_data:
    name: ${COMPOSE_PROJECT_NAME}-backend_pgadmin_data
