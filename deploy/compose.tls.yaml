services:
  proxy:
    ports:
      - "${PROXY_BIND:-127.0.0.1}:443:443"
    volumes:
      - ../proxy/nginx_secure.conf:/etc/nginx/conf.d/default.conf:ro
      - ../proxy/locations.conf:/etc/nginx/locations.conf:ro
      - ../proxy/certs/cert.pem:/etc/ssl/certs/cert.pem:ro
      - ../proxy/certs/key.pem:/etc/ssl/private/key.pem:ro