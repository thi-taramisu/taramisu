# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: Taramisu local development
  labels:
    blueprints.goauthentik.io/instantiate: "false"
entries:
  - model: authentik_brands.brand
    identifiers:
      domain: authentik-default
      default: true
    attrs:
      branding_title: Taramisu
      branding_logo: /static/dist/assets/icons/blank.svg
      branding_favicon: /static/dist/assets/icons/blank.svg
      branding_default_flow_background: /static/dist/assets/icons/blank.svg
      branding_custom_css: |
        ak-flow-executor::part(branding),
        ak-flow-executor::part(footer) {
          display: none;
        }
        ak-flow-executor::part(login) {
          --ak-c-login__main-ColumnWidth: min(28rem, calc(100vw - 2rem));
          grid-template-rows: 1fr auto 1fr;
          background: light-dark(#f4f5f7, #15171c);
        }
        ak-flow-executor::part(main) {
          --ak-c-login__main--BoxShadow: 0 12px 40px rgb(0 0 0 / 12%);
          align-self: center;
          border: 1px solid light-dark(#e2e5ea, #30343b);
          border-radius: 0.75rem;
        }
  - model: authentik_flows.flow
    identifiers:
      slug: default-authentication-flow
    attrs:
      title: Sign in to Taramisu
  - model: authentik_providers_oauth2.oauth2provider
    id: taramisu-provider
    identifiers:
      name: Taramisu
    attrs:
      client_type: confidential
      client_id: !Env OIDC_CLIENT_ID
      client_secret: !Env OIDC_CLIENT_SECRET
      grant_types:
        - authorization_code
      issuer_mode: per_provider
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: !Env OIDC_REDIRECT_URI
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
  - model: authentik_core.application
    identifiers:
      slug: taramisu
    attrs:
      name: Taramisu
      provider: !KeyOf taramisu-provider
  - model: authentik_core.user
    identifiers:
      username: dev
    attrs:
      name: Development user
      email: dev@taramisu.localhost
      is_active: true
      password: !Env DEV_PASSWORD
