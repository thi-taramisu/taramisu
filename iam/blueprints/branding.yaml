# Generated by iam/branding/generate.py; edit the palettes or branding template.
# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: Taramisu branding
  labels:
    blueprints.goauthentik.io/instantiate: "false"
entries:
  - model: authentik_brands.brand
    identifiers:
      domain: authentik-default
      default: true
    attrs:
      branding_title: Taramisu
      branding_logo: /static/dist/assets/icons/blank.svg
      branding_favicon: /static/dist/assets/icons/blank.svg
      branding_default_flow_background: /static/dist/assets/icons/blank.svg
      branding_custom_css: |
        ak-flow-executor {
          --taramisu-background: light-dark(#ffffff, #171717);
          --taramisu-foreground: light-dark(#171717, #fafafa);
          --taramisu-card: light-dark(#ffffff, #262626);
          --taramisu-card-foreground: light-dark(#171717, #fafafa);
          --taramisu-primary: light-dark(#262626, #e5e5e5);
          --taramisu-primary-foreground: light-dark(#fafafa, #262626);
          --taramisu-muted: light-dark(#f5f5f5, #404040);
          --taramisu-muted-foreground: light-dark(#525252, #d4d4d4);
          --taramisu-border: light-dark(#e5e5e5, #525252);
          --taramisu-input: light-dark(#d4d4d4, #737373);
          --taramisu-ring: light-dark(#525252, #a3a3a3);
          --taramisu-destructive: light-dark(#b91c1c, #f87171);
          --taramisu-radius: 0.625rem;
        }
        html[data-color-scheme="ocean"] ak-flow-executor {
          --taramisu-background: light-dark(#f8fafc, #0f172a);
          --taramisu-foreground: light-dark(#0f172a, #f1f5f9);
          --taramisu-card: light-dark(#ffffff, #1e293b);
          --taramisu-card-foreground: light-dark(#0f172a, #f1f5f9);
          --taramisu-primary: light-dark(#1d4ed8, #93c5fd);
          --taramisu-primary-foreground: light-dark(#ffffff, #172554);
          --taramisu-muted: light-dark(#f1f5f9, #1e293b);
          --taramisu-muted-foreground: light-dark(#475569, #cbd5e1);
          --taramisu-border: light-dark(#cbd5e1, #475569);
          --taramisu-input: light-dark(#94a3b8, #64748b);
          --taramisu-ring: light-dark(#2563eb, #60a5fa);
          --taramisu-destructive: light-dark(#b91c1c, #f87171);
          --taramisu-radius: 0.625rem;
        }
        html[data-color-scheme="iris"] ak-flow-executor {
          --taramisu-background: light-dark(#fafaf9, #1c1917);
          --taramisu-foreground: light-dark(#292524, #fafaf9);
          --taramisu-card: light-dark(#ffffff, #292524);
          --taramisu-card-foreground: light-dark(#292524, #fafaf9);
          --taramisu-primary: light-dark(#6d28d9, #c4b5fd);
          --taramisu-primary-foreground: light-dark(#ffffff, #2e1065);
          --taramisu-muted: light-dark(#f5f5f4, #292524);
          --taramisu-muted-foreground: light-dark(#57534e, #d6d3d1);
          --taramisu-border: light-dark(#d6d3d1, #57534e);
          --taramisu-input: light-dark(#a8a29e, #78716c);
          --taramisu-ring: light-dark(#7c3aed, #a78bfa);
          --taramisu-destructive: light-dark(#b91c1c, #f87171);
          --taramisu-radius: 0.625rem;
        }
        ak-flow-executor {
          --pf-global--FontFamily--text: "Geist Variable", sans-serif;
          --pf-global--FontFamily--heading: var(--pf-global--FontFamily--text);
          font-family: var(--pf-global--FontFamily--text);
        }
        ak-flow-executor::part(branding),
        ak-flow-executor::part(footer) {
          display: none;
        }
        ak-flow-executor::part(login) {
          --ak-c-login__main-ColumnWidth: min(28rem, calc(100vw - 2rem));
          grid-template-rows: 1fr auto 1fr;
          background: var(--taramisu-background);
        }
        ak-flow-executor::part(locale-select) {
          color: var(--taramisu-foreground);
          text-shadow: none;
        }
        ak-flow-executor::part(main) {
          --ak-c-login__main--BoxShadow: 0 12px 40px rgb(0 0 0 / 12%);
          align-self: center;
          background: var(--taramisu-card);
          color: var(--taramisu-card-foreground);
          border: 1px solid var(--taramisu-border);
          border-radius: var(--taramisu-radius);
        }
        /* Brand CSS is adopted into Authentik's shadow roots. Scope controls to flows. */
        :host-context(ak-flow-executor) .pf-c-button.pf-m-primary {
          font-family: inherit;
          font-size: 0.875rem;
          font-weight: 500;
          background: var(--taramisu-primary);
          color: var(--taramisu-primary-foreground);
          border-radius: calc(var(--taramisu-radius) * 0.8);
        }
        :host-context(ak-flow-executor) .pf-c-button.pf-m-primary:hover:not(:disabled) {
          background: color-mix(in srgb, var(--taramisu-primary) 90%, transparent);
        }
        :host-context(ak-flow-executor) .pf-c-button:focus-visible,
        :host-context(ak-flow-executor) a:focus-visible {
          outline: 2px solid var(--taramisu-ring);
          outline-offset: 2px;
        }
        :host-context(ak-flow-executor) .pf-c-button:disabled {
          opacity: 0.5;
        }
        :host-context(ak-flow-executor) .pf-c-form-control {
          font-family: inherit;
          --pf-c-form-control--BackgroundColor: var(--taramisu-card);
          --pf-c-form-control--Color: var(--taramisu-card-foreground);
          --pf-c-form-control--BorderTopColor: var(--taramisu-input);
          --pf-c-form-control--BorderRightColor: var(--taramisu-input);
          --pf-c-form-control--BorderBottomColor: var(--taramisu-input);
          --pf-c-form-control--BorderLeftColor: var(--taramisu-input);
          --pf-c-form-control--BorderRadius: calc(var(--taramisu-radius) * 0.8);
          --pf-c-form-control--focus--BorderBottomColor: var(--taramisu-ring);
          --pf-c-form-control--hover--BorderBottomColor: var(--taramisu-ring);
          --pf-c-form-control--invalid--BorderBottomColor: var(--taramisu-destructive);
          --pf-c-form-control--placeholder--Color: var(--taramisu-muted-foreground);
        }
        :host-context(ak-flow-executor) .pf-c-login__main-footer-band {
          background: var(--taramisu-muted);
          color: var(--taramisu-foreground);
        }
        :host-context(ak-flow-executor) a {
          color: var(--taramisu-primary);
        }
  - model: authentik_flows.flow
    identifiers:
      slug: default-authentication-flow
    attrs:
      title: Sign in to Taramisu
