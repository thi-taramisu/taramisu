"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<title>Taramisu – Interactive Concept<\u002Ftitle>\n<script src=\"10bf26b2-8b77-4ad1-842b-1dad02fc9f58\"><\u002Fscript>\n<meta name=\"hz:slide-selector\" content=\"[data-canvas-width]\"><meta name=\"hz:canvas-width\" content=\"1440\"><meta name=\"hz:canvas-height\" content=\"1000\"><\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap\">\n<style>\nbody{margin:0}\na{color:#44506a}a:hover{color:#1f2633}\nbutton,input,select,textarea{font:inherit;color:inherit}\nbutton{cursor:pointer}\nbutton:disabled{cursor:not-allowed;opacity:.45}\n.trow:hover{background:#f3f5f9}\n.pick:hover{background:#eef1f6}\n.rrow:hover{background:#f7f8fb}\n.lnk{border:0;background:transparent;padding:0;font-weight:600;text-decoration:underline;text-decoration-color:#b9c1ce;text-underline-offset:3px;text-align:left}\n.lnk:hover{text-decoration-color:#1f2633}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"width: 1440px; height: 1000px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #ffffff; color: #1f2633; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 13px\" data-canvas-width=\"1440\" data-canvas-height=\"1000\" data-document-role=\"page\" data-label=\"Interactive concept – Battery Security example\">\n\n  <div style=\"height: 10px; background: #a3adbd\"><\u002Fdiv>\n  <header style=\"height: 40px; background: #e1e6ed; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid #cdd3dc; position: relative\">\n    <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 14 14\" aria-hidden=\"true\"><path d=\"M2 3.5h10M2 7h10M2 10.5h10\" stroke=\"#44506a\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n    <span style=\"font-weight: 600\">Taramisu<\u002Fspan>\n    <div style=\"flex: 1\"><\u002Fdiv>\n    <span style=\"font-size: 11px; color: #6b7383\">Risk profile: Example matrix v1 · Attack potential (Annex G)<\u002Fspan>\n    <div style=\"width: 22px; height: 22px; border-radius: 50%; background: #c5ccd8\"><\u002Fdiv>\n  <\u002Fheader>\n\n  <div style=\"flex: 1; min-height: 0; display: flex\">\n\n    <!-- ================= LEFT ================= -->\n    <aside style=\"width: 300px; flex: none; border-right: 1px solid #dde2ea; display: flex; flex-direction: column\">\n      <div style=\"padding: 12px 12px 0\">\n        <button sc-camel-on-click=\"{{toggleProj}}\" aria-haspopup=\"menu\" style=\"width: 100%; min-height: 42px; display: flex; align-items: center; gap: 8px; border: 1px solid #cdd3dc; border-radius: 10px; background: #ffffff; padding: 4px 10px 4px 12px; text-align: left\">\n          <span style=\"flex: 1; display: flex; flex-direction: column; gap: 1px\">\n            <span style=\"font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; color: #6b7383\">Project<\u002Fspan>\n            <span style=\"font-size: 12px; font-weight: 600\">Battery Security<\u002Fspan>\n          <\u002Fspan>\n          <svg width=\"10\" height=\"10\" sc-camel-view-box=\"0 0 10 10\" aria-hidden=\"true\"><path d=\"M1.5 3.5 5 7l3.5-3.5\" fill=\"none\" stroke=\"#44506a\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n        <\u002Fbutton>\n      <\u002Fdiv>\n      <sc-if value=\"{{settingsMode}}\">\n        <div style=\"flex: 1; min-height: 0; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px\">\n          <button sc-camel-on-click=\"{{backToAnalysis}}\" style=\"min-height: 36px; border: 0; background: transparent; text-align: left; padding: 0 10px; border-radius: 6px; font-size: 12px; color: #44506a\">← Back to analysis<\u002Fbutton>\n          <div style=\"font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: #6b7383; padding: 10px 10px 4px\">Project settings<\u002Fdiv>\n          <sc-for list=\"{{setNav}}\" as=\"sn\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{sn.onPick}}\" style=\"{{sn.style}}\">\n              <span style=\"flex: 1\">{{sn.label}}<\u002Fspan>\n              <sc-if value=\"{{sn.hasCount}}\"><span style=\"font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 9px; background: #e1e6ed; color: #44506a\">{{sn.count}}<\u002Fspan><\u002Fsc-if>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n          <div style=\"flex: 1\"><\u002Fdiv>\n          <div style=\"font-size: 11px; color: #6b7383; line-height: 1.5; padding: 0 10px 6px\">Only owners can change settings and members. Other roles see this page read-only.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{treeMode}}\" hint-placeholder-val=\"{{true}}\">\n        <div style=\"display: flex; gap: 8px; align-items: center; padding: 12px 12px 8px\">\n          <input aria-label=\"Search the hierarchy\" placeholder=\"Search name or ID\" style=\"flex: 1; min-width: 0; height: 32px; box-sizing: border-box; border: 1px solid #cdd3dc; border-radius: 6px; padding: 0 10px; font-size: 12px; background: #fafbfc\">\n          <button sc-camel-on-click=\"{{toggleMenu}}\" aria-haspopup=\"menu\" style=\"height: 32px; display: flex; align-items: center; gap: 6px; border: 0; border-radius: 6px; padding: 0 12px; background: #44506a; color: #ffffff; font-size: 12px; font-weight: 600\">\n            <svg width=\"11\" height=\"11\" sc-camel-view-box=\"0 0 12 12\" aria-hidden=\"true\"><path d=\"M6 1.5v9M1.5 6h9\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n            New\n          <\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"flex: 1; min-height: 0; overflow: auto; padding: 4px 10px 12px; display: flex; flex-direction: column; gap: 3px\">\n          <sc-for list=\"{{rows}}\" as=\"row\" hint-placeholder-count=\"14\">\n            <div style=\"display: flex; align-items: center; gap: 2px; padding-left: {{row.indent}}px\">\n              <sc-if value=\"{{row.hasKids}}\" hint-placeholder-val=\"{{true}}\">\n                <button aria-label=\"{{row.togLabel}}\" sc-camel-on-click=\"{{row.onTog}}\" style=\"width: 20px; height: 28px; flex: none; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; color: #6b7383\">\n                  <svg width=\"10\" height=\"10\" sc-camel-view-box=\"0 0 10 10\" style=\"transform: {{row.chev}}\" aria-hidden=\"true\"><path d=\"M3 1.5 6.5 5 3 8.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                <\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{row.noKids}}\"><div style=\"width: 20px; flex: none\"><\u002Fdiv><\u002Fsc-if>\n              <sc-if value=\"{{row.isPill}}\" hint-placeholder-val=\"{{true}}\">\n                <div class=\"trow\" style=\"{{row.box}}\">\n                  <button sc-camel-on-click=\"{{row.onSel}}\" style=\"flex: 1; min-width: 0; border: 0; background: transparent; text-align: left; padding: 3px 0; display: flex; flex-direction: column; gap: 1px\">\n                    <sc-if value=\"{{row.hasTypeLine}}\"><span style=\"font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; color: #6b7383; white-space: nowrap\">{{row.typeLine}}<\u002Fspan><\u002Fsc-if>\n                    <span style=\"{{row.nameStyle}}\">{{row.name}}<\u002Fspan>\n                  <\u002Fbutton>\n                  <sc-if value=\"{{row.showWarn}}\"><span title=\"{{row.warnTitle}}\" style=\"flex: none; font-size: 10px; font-weight: 600; padding: 1px 5px; border-radius: 8px; border: 1px solid #c58b2b; color: #7a4d0b; background: #fff8ec\">!<\u002Fspan><\u002Fsc-if>\n                  <sc-if value=\"{{row.showCount}}\"><span title=\"{{row.countTitle}}\" style=\"flex: none; font-size: 10px; font-weight: 600; padding: 1px 5px; border-radius: 8px; border: 1px solid #8e9ab1; color: #44506a; background: #ffffff\">{{row.countText}}<\u002Fspan><\u002Fsc-if>\n                  <sc-if value=\"{{row.showTag}}\"><span title=\"{{row.tagTitle}}\" style=\"{{row.tagStyle}}\">{{row.tagText}}<\u002Fspan><\u002Fsc-if>\n                  <sc-if value=\"{{row.showPlus}}\">\n                    <button aria-label=\"{{row.plusLabel}}\" title=\"{{row.plusLabel}}\" sc-camel-on-click=\"{{row.onPlus}}\" style=\"flex: none; width: 24px; height: 24px; border-radius: 6px; border: 1px solid #8e9ab1; background: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0; color: #44506a\">\n                      <svg width=\"10\" height=\"10\" sc-camel-view-box=\"0 0 12 12\" aria-hidden=\"true\"><path d=\"M6 1.5v9M1.5 6h9\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n                    <\u002Fbutton>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{row.isGrp}}\"><span style=\"font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: #6b7383; padding: 6px 0 2px\">{{row.name}}<\u002Fspan><\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"padding: 8px 14px; border-top: 1px solid #eef0f4; font-size: 10px; color: #6b7383; line-height: 1.5\">R3 = risk via the parent damage scenario · max 4 = highest risk, no damage context · ×2 = same object in 2 places<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Faside>\n\n    <!-- ================= RIGHT ================= -->\n    <main style=\"flex: 1; min-width: 0; overflow: auto; padding: 20px 80px 96px 36px\">\n      <sc-if value=\"{{settingsMode}}\">\n        <div style=\"font-size: 11px; color: #6b7383; margin-bottom: 6px\">Battery Security  ›  Settings<\u002Fdiv>\n        <h1 style=\"margin: 0 0 18px; font-size: 20px; font-weight: 600\">{{setTitle}}<\u002Fh1>\n        <sc-if value=\"{{setGeneral}}\">\n          <div style=\"max-width: 860px; display: flex; flex-direction: column; gap: 18px\">\n            <section style=\"border: 1px solid #dde2ea; border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px\">\n              <label style=\"display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: #5b6474\">Project name *\n                <input value=\"{{projName}}\" sc-camel-on-change=\"{{setProjName}}\" style=\"height: 36px; box-sizing: border-box; border: 1px solid #8e9ab1; border-radius: 6px; padding: 0 10px; font-size: 13px; color: #1f2633\">\n              <\u002Flabel>\n              <label style=\"display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: #5b6474\">Description\n                <textarea rows=\"3\" placeholder=\"What is analyzed in this project?\" style=\"box-sizing: border-box; border: 1px solid #cdd3dc; border-radius: 6px; padding: 8px 10px; font-size: 13px; color: #1f2633; resize: none\"><\u002Ftextarea>\n              <\u002Flabel>\n            <\u002Fsection>\n            <section style=\"border: 1px solid #dde2ea; border-radius: 10px; overflow: hidden\">\n              <div style=\"padding: 10px 14px; background: #f5f7fa; border-bottom: 1px solid #dde2ea; display: flex; align-items: center; gap: 8px\">\n                <h2 style=\"margin: 0; font-size: 13px; font-weight: 600\">Assessment profile<\u002Fh2>\n                <span style=\"font-size: 11px; color: #7a8291\">used by all items of this project<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"padding: 12px 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; font-size: 12px\">\n                <div><div style=\"font-size: 11px; color: #6b7383\">Impact scale<\u002Fdiv><div>Severe · Major · Moderate · Negligible<\u002Fdiv><\u002Fdiv>\n                <label style=\"display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: #6b7383\">Default feasibility method\n                  <sc-raw-select value=\"{{defMethod}}\" sc-camel-on-change=\"{{setDefMethod}}\" style=\"height: 32px; border: 1px solid #cdd3dc; border-radius: 6px; padding: 0 8px; font-size: 12px; background: #ffffff; color: #1f2633\">\n                    <option value=\"AP\">Attack potential (G.2)<\u002Foption>\n                    <option value=\"CVSS\">CVSS exploitability (G.3)<\u002Foption>\n                    <option value=\"AV\">Attack vector (G.4)<\u002Foption>\n                  <\u002Fsc-raw-select>\n                  <span style=\"font-size: 10px\">for new attack paths; can be changed per path<\u002Fspan>\n                <\u002Flabel>\n                <div><div style=\"font-size: 11px; color: #6b7383\">Risk determination<\u002Fdiv><div>Example risk matrix v1 (1–5)<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsection>\n            <section style=\"border: 1px solid #dde2ea; border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 12px\">\n              <div style=\"flex: 1\"><div style=\"font-weight: 600\">AI assistant<\u002Fdiv><div style=\"font-size: 12px; color: #5b6474\">Off by default. When on, the open object and view are sent to [configured model endpoint]. Suggestions are only applied by explicit click and are marked and logged.<\u002Fdiv><\u002Fdiv>\n              <label style=\"display: flex; align-items: center; gap: 8px; font-size: 13px\"><input type=\"checkbox\" checked=\"{{aiOn}}\" sc-camel-on-change=\"{{toggleAi}}\" style=\"width: 18px; height: 18px\"> Enabled<\u002Flabel>\n            <\u002Fsection>\n            <section style=\"border: 1px solid #e2b7b7; border-radius: 10px; overflow: hidden\">\n              <div style=\"display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #f1dede\">\n                <div style=\"flex: 1\"><div style=\"font-weight: 600\">Archive project<\u002Fdiv><div style=\"font-size: 12px; color: #5b6474\">Read-only for all members. Can be restored.<\u002Fdiv><\u002Fdiv>\n                <button style=\"height: 32px; border: 1px solid #c3cad6; border-radius: 6px; background: #ffffff; padding: 0 12px; font-size: 12px\">Archive…<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"display: flex; align-items: center; gap: 12px; padding: 12px 14px\">\n                <div style=\"flex: 1\"><div style=\"font-weight: 600\">Delete project<\u002Fdiv><div style=\"font-size: 12px; color: #5b6474\">Permanently deletes all items, objects, links and files. Requires typing the project name.<\u002Fdiv><\u002Fdiv>\n                <button style=\"height: 32px; border: 1px solid #b23b3b; border-radius: 6px; background: #ffffff; color: #8f2424; padding: 0 12px; font-size: 12px; font-weight: 600\">Delete…<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsection>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{setMembers}}\">\n          <div style=\"max-width: 980px; display: flex; flex-direction: column; gap: 16px\">\n            <div style=\"display: flex; align-items: center; gap: 12px\">\n              <span style=\"flex: 1; font-size: 12px; color: #5b6474\">Users and groups come from the university login (IAM). Taramisu stores only the reference and the role.<\u002Fspan>\n              <button style=\"height: 34px; border: 0; border-radius: 6px; background: #44506a; color: #ffffff; padding: 0 14px; font-size: 12px; font-weight: 600\">+ Add members<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px\">\n              <sc-for list=\"{{roles}}\" as=\"ro\" hint-placeholder-count=\"4\">\n                <div style=\"border: 1px solid #dde2ea; border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px\">\n                  <span style=\"font-weight: 600\">{{ro.name}}<\u002Fspan>\n                  <span style=\"font-size: 11px; color: #5b6474; line-height: 1.45\">{{ro.desc}}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"border: 1px solid #dde2ea; border-radius: 10px; overflow: hidden\">\n              <div style=\"display: grid; grid-template-columns: minmax(0, 2fr) 90px 170px 90px 40px; gap: 12px; align-items: center; padding: 8px 14px; background: #f5f7fa; border-bottom: 1px solid #dde2ea; font-size: 11px; color: #5b6474\">\n                <span>Member<\u002Fspan><span>Type<\u002Fspan><span>Role<\u002Fspan><span>Added<\u002Fspan><span><\u002Fspan>\n              <\u002Fdiv>\n              <sc-for list=\"{{members}}\" as=\"mb\" hint-placeholder-count=\"4\">\n                <div style=\"display: grid; grid-template-columns: minmax(0, 2fr) 90px 170px 90px 40px; gap: 12px; align-items: center; padding: 8px 14px; border-top: 1px solid #eef0f4; min-height: 50px; box-sizing: border-box\">\n                  <span style=\"display: flex; align-items: center; gap: 10px; min-width: 0\">\n                    <span style=\"{{mb.avatar}}\">{{mb.initials}}<\u002Fspan>\n                    <span style=\"display: flex; flex-direction: column\"><span style=\"font-weight: 600\">{{mb.name}}<\u002Fspan><span style=\"font-size: 11px; color: #6b7383\">{{mb.sub}}<\u002Fspan><\u002Fspan>\n                  <\u002Fspan>\n                  <span style=\"font-size: 12px\">{{mb.type}}<\u002Fspan>\n                  <sc-raw-select aria-label=\"{{mb.roleLabel}}\" value=\"{{mb.role}}\" sc-camel-on-change=\"{{mb.onRole}}\" disabled=\"{{mb.locked}}\" style=\"height: 32px; border: 1px solid #cdd3dc; border-radius: 6px; padding: 0 8px; font-size: 12px; background: #ffffff; color: #1f2633\">\n                    <option value=\"Owner\">Owner<\u002Foption><option value=\"Editor\">Editor<\u002Foption><option value=\"Reviewer\">Reviewer<\u002Foption><option value=\"Viewer\">Viewer<\u002Foption>\n                  <\u002Fsc-raw-select>\n                  <span style=\"font-size: 12px; color: #5b6474\">{{mb.added}}<\u002Fspan>\n                  <button aria-label=\"{{mb.removeLabel}}\" title=\"{{mb.removeTitle}}\" disabled=\"{{mb.locked}}\" sc-camel-on-click=\"{{mb.onRemove}}\" style=\"width: 30px; height: 30px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0; color: #6b7383\">\n                    <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 12 12\" aria-hidden=\"true\"><path d=\"M3 3l6 6M9 3l-6 6\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"font-size: 12px; color: #5b6474\">A project needs at least one owner; the last owner cannot be removed or downgraded.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{setData}}\">\n          <div style=\"max-width: 860px; display: flex; flex-direction: column; gap: 18px\">\n            <section style=\"border: 1px solid #dde2ea; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px\">\n              <h2 style=\"margin: 0; font-size: 13px; font-weight: 600\">Export complete project<\u002Fh2>\n              <span style=\"font-size: 12px; color: #5b6474\">All items, objects, links, ratings, treatment decisions and the assessment profile in one file; can be imported again.<\u002Fspan>\n              <label style=\"display: flex; align-items: center; gap: 8px; min-height: 28px; font-size: 13px\"><input type=\"checkbox\" checked=\"{{true}}\"> Include supporting files<\u002Flabel>\n              <div><button style=\"height: 34px; border: 0; border-radius: 6px; background: #44506a; color: #ffffff; padding: 0 14px; font-size: 12px; font-weight: 600\">Export project (.taramisu.zip)<\u002Fbutton><\u002Fdiv>\n            <\u002Fsection>\n            <section style=\"border: 1px solid #dde2ea; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px\">\n              <h2 style=\"margin: 0; font-size: 13px; font-weight: 600\">Import<\u002Fh2>\n              <button style=\"min-height: 90px; border: 1px dashed #a9b1bf; border-radius: 8px; background: #fafbfc; font-size: 12px; color: #44506a\">Drop a .taramisu.zip file here or browse · always creates a new project<\u002Fbutton>\n            <\u002Fsection>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n      <sc-if value=\"{{analysisMode}}\" hint-placeholder-val=\"{{true}}\">\n      <div style=\"font-size: 11px; color: #6b7383; margin-bottom: 6px; min-height: 14px\">{{crumb}}<\u002Fdiv>\n      <div style=\"display: flex; align-items: flex-start; gap: 12px\">\n        <div style=\"flex: 1; min-width: 0\">\n          <div style=\"font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #6b7383\">{{typeLabel}}<\u002Fdiv>\n          <h1 style=\"margin: 2px 0 0; font-size: 20px; font-weight: 600; display: flex; gap: 10px; align-items: baseline\">\n            <sc-if value=\"{{hasId}}\"><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500; color: #5b6474\">{{selId}}<\u002Fspan><\u002Fsc-if>\n            <span>{{title}}<\u002Fspan>\n          <\u002Fh1>\n        <\u002Fdiv>\n        <sc-if value=\"{{canDup}}\">\n          <div style=\"position: relative\">\n            <button sc-camel-on-click=\"{{toggleDup}}\" aria-haspopup=\"menu\" style=\"height: 30px; border: 1px solid #c3cad6; border-radius: 6px; background: #ffffff; padding: 0 10px; font-size: 12px\">Duplicate for another property ▾<\u002Fbutton>\n            <sc-if value=\"{{dupOpen}}\">\n              <div role=\"menu\" style=\"position: absolute; top: 36px; right: 0; width: 330px; z-index: 15; background: #ffffff; border: 1px solid #cdd3dc; border-radius: 10px; box-shadow: 0 10px 28px rgba(30, 40, 60, 0.18); padding: 6px; box-sizing: border-box\">\n                <div style=\"font-size: 11px; color: #6b7383; padding: 6px 10px 6px; line-height: 1.4\">Creates a new threat scenario with the same damage scenarios and the same (shared) attack paths.<\u002Fdiv>\n                <sc-for list=\"{{dupItems}}\" as=\"du\" hint-placeholder-count=\"2\">\n                  <button role=\"menuitem\" class=\"pick\" sc-camel-on-click=\"{{du.onPick}}\" style=\"width: 100%; min-height: 38px; border: 0; background: transparent; text-align: left; padding: 6px 10px; border-radius: 6px; font-size: 12px\">{{du.label}}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <span style=\"{{statusStyle}}\">{{statusText}}<\u002Fspan>\n        <sc-if value=\"{{hasBadge}}\"><span title=\"{{badgeTitle}}\" style=\"{{badgeStyle}}\">{{badgeText}}<\u002Fspan><\u002Fsc-if>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{hasTrace}}\">\n        <div style=\"margin-top: 12px; max-width: 940px; border: 1px solid #dde2ea; border-radius: 10px; padding: 8px 10px; display: flex; align-items: center; gap: 10px; background: #fafbfc; position: relative\">\n          <span style=\"font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: #6b7383; flex: none\">Trace<\u002Fspan>\n          <div style=\"flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px\">\n            <sc-for list=\"{{trace}}\" as=\"tc\" hint-placeholder-count=\"4\">\n              <sc-if value=\"{{tc.isArrow}}\"><span aria-hidden=\"true\" style=\"color: #8e9ab1; padding: 0 2px\">→<\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{tc.isChip}}\">\n                <button sc-camel-on-click=\"{{tc.onOpen}}\" title=\"{{tc.title}}\" style=\"{{tc.style}}\">\n                  <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5b6474\">{{tc.id}}<\u002Fspan>\n                  <span>{{tc.name}}<\u002Fspan>\n                  <sc-if value=\"{{tc.hasSub}}\"><span style=\"color: #5b6474; font-weight: 400\">· {{tc.sub}}<\u002Fspan><\u002Fsc-if>\n                <\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{tc.isResult}}\"><span style=\"{{tc.style}}\">{{tc.text}}<\u002Fspan><\u002Fsc-if>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{multiCtx}}\"><button sc-camel-on-click=\"{{toggleCtx}}\" aria-haspopup=\"listbox\" style=\"flex: none; height: 30px; border: 1px dashed #5f7196; border-radius: 6px; background: #ffffff; padding: 0 10px; font-size: 12px; color: #2c3547\">{{ctxLabel}} ▾<\u002Fbutton><\u002Fsc-if>\n          <sc-if value=\"{{ctxOpen}}\">\n            <div role=\"listbox\" aria-label=\"Contexts\" style=\"position: absolute; top: 46px; right: 0; width: 460px; z-index: 15; background: #ffffff; border: 1px solid #cdd3dc; border-radius: 10px; box-shadow: 0 10px 28px rgba(30, 40, 60, 0.18); padding: 6px; box-sizing: border-box\">\n              <div style=\"font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: #6b7383; padding: 6px 10px 4px\">Same object, reached via<\u002Fdiv>\n              <sc-for list=\"{{ctxList}}\" as=\"cx\" hint-placeholder-count=\"2\">\n                <button role=\"option\" aria-selected=\"{{cx.on}}\" class=\"pick\" sc-camel-on-click=\"{{cx.onPick}}\" style=\"{{cx.style}}\">\n                  <span style=\"flex: 1; min-width: 0\">{{cx.text}}<\u002Fspan>\n                  <sc-if value=\"{{cx.hasRisk}}\"><span style=\"{{cx.riskStyle}}\">{{cx.risk}}<\u002Fspan><\u002Fsc-if>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-for list=\"{{banners}}\" as=\"b\" hint-placeholder-count=\"0\">\n        <div style=\"margin-top: 10px; display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 8px; background: #f3f5f9; border: 1px solid #dde2ea; font-size: 12px; max-width: 940px; box-sizing: border-box\">\n          <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 14 14\" aria-hidden=\"true\"><circle cx=\"7\" cy=\"7\" r=\"5.5\" fill=\"none\" stroke=\"#5b6474\" stroke-width=\"1.3\"><\u002Fcircle><path d=\"M7 6.2v3.6M7 4.3h0\" stroke=\"#5b6474\" stroke-width=\"1.4\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n          <span style=\"flex: 1\">{{b.text}}<\u002Fspan>\n          <sc-if value=\"{{b.hasAct}}\"><button sc-camel-on-click=\"{{b.onAct}}\" style=\"height: 30px; border: 1px solid #c3cad6; border-radius: 6px; background: #ffffff; padding: 0 10px; font-size: 12px\">{{b.act}}<\u002Fbutton><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n\n      <nav aria-label=\"Object views\" style=\"display: flex; gap: 2px; margin: 14px 0 18px; border-bottom: 1px solid #dde2ea\">\n        <sc-for list=\"{{tabs}}\" as=\"t\" hint-placeholder-count=\"5\">\n          <button sc-camel-on-click=\"{{t.onPick}}\" style=\"{{t.style}}\">\n            {{t.label}}\n            <sc-if value=\"{{t.hasCount}}\"><span style=\"font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 8px; background: #e1e6ed; color: #44506a\">{{t.count}}<\u002Fspan><\u002Fsc-if>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fnav>\n\n      <div style=\"max-width: 940px; display: flex; flex-direction: column; gap: 18px\">\n\n        <sc-if value=\"{{showFields}}\">\n          <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px\">\n            <sc-for list=\"{{fields}}\" as=\"f\" hint-placeholder-count=\"4\">\n              <label style=\"{{f.cell}}\">\n                <span style=\"display: flex; align-items: center; gap: 5px\">\n                  <span>{{f.label}}<sc-if value=\"{{f.req}}\"><span style=\"color: #7a1f1f\"> *<\u002Fspan><\u002Fsc-if><\u002Fspan><sc-if value=\"{{f.hasAi}}\"><span title=\"Text accepted from an AI suggestion, not yet reviewed\" style=\"font-size: 9px; font-weight: 600; padding: 1px 5px; border-radius: 6px; border: 1px dashed #8e9ab1; color: #44506a\">AI<\u002Fspan><\u002Fsc-if>\n                <\u002Fspan>\n                <sc-if value=\"{{f.multi}}\"><textarea sc-camel-read-only=\"{{true}}\" rows=\"3\" value=\"{{f.value}}\" placeholder=\"{{f.ph}}\" sc-camel-on-focus=\"{{f.onFocus}}\" style=\"{{f.boxStyle}}\"><\u002Ftextarea><\u002Fsc-if>\n                <sc-if value=\"{{f.single}}\"><input sc-camel-read-only=\"{{true}}\" value=\"{{f.value}}\" placeholder=\"{{f.ph}}\" sc-camel-on-focus=\"{{f.onFocus}}\" style=\"{{f.boxStyle}}\"><\u002Fsc-if>\n                <sc-if value=\"{{f.isSelect}}\"><sc-raw-select value=\"{{f.value}}\" sc-camel-on-focus=\"{{f.onFocus}}\" style=\"{{f.selStyle}}\"><sc-for list=\"{{f.options}}\" as=\"op\" hint-placeholder-count=\"3\"><option value=\"{{op.v}}\">{{op.v}}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fsc-if>\n              <\u002Flabel>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- Item files -->\n        <sc-if value=\"{{showFiles}}\">\n          <section style=\"border: 1px solid #dde2ea; border-radius: 10px; overflow: hidden\">\n            <div style=\"display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: #f5f7fa; border-bottom: 1px solid #dde2ea\">\n              <h2 style=\"margin: 0; font-size: 13px; font-weight: 600\">Supporting files<\u002Fh2>\n              <span style=\"font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 9px; background: #e1e6ed; color: #44506a\">{{fileCount}}<\u002Fspan>\n              <span style=\"font-size: 11px; color: #7a8291\">sketches, architecture, interface lists · optional, never a substitute for the written definition<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"padding: 12px 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px\">\n              <sc-for list=\"{{files}}\" as=\"fl\" hint-placeholder-count=\"2\">\n                <div style=\"border: 1px solid #dde2ea; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column\">\n                  <div style=\"{{fl.thumb}}\">\n                    <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; color: #44506a\">{{fl.ext}}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 10px\">\n                    <div style=\"flex: 1; min-width: 0\">\n                      <div style=\"font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{fl.name}}<\u002Fdiv>\n                      <div style=\"font-size: 10px; color: #6b7383\">{{fl.size}}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <button aria-label=\"{{fl.removeLabel}}\" sc-camel-on-click=\"{{fl.onRemove}}\" style=\"width: 28px; height: 28px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0; color: #6b7383\">\n                      <svg width=\"11\" height=\"11\" sc-camel-view-box=\"0 0 12 12\" aria-hidden=\"true\"><path d=\"M3 3l6 6M9 3l-6 6\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n                    <\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <button sc-camel-on-click=\"{{addFiles}}\" style=\"min-height: 120px; border: 1px dashed #a9b1bf; border-radius: 8px; background: #fafbfc; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: #44506a\">\n                <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M9 12V3M5.5 6.5 9 3l3.5 3.5M3 12v3h12v-3\" fill=\"none\" stroke=\"#5b6474\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                Drop files here or browse\n                <span style=\"font-size: 10px; color: #7a8291\">multiple files · images, PDF, office documents<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fsc-if>\n\n        <!-- Asset: properties -->\n        <sc-if value=\"{{isProps}}\">\n          <section style=\"border: 1px solid #dde2ea; border-radius: 10px; overflow: hidden\">\n            <div style=\"display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: #f5f7fa; border-bottom: 1px solid #dde2ea\">\n              <h2 style=\"margin: 0; font-size: 13px; font-weight: 600\">Cybersecurity properties<\u002Fh2>\n              <span style=\"font-size: 11px; color: #7a8291\">declared here, or automatically when you pick C / I / A on a link (RQ-15-02, WP-15-02)<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{propRows}}\" as=\"pr\" hint-placeholder-count=\"3\">\n              <div style=\"display: grid; grid-template-columns: 34px 130px minmax(0, 1fr) 150px; gap: 12px; align-items: center; padding: 8px 14px; border-top: 1px solid #eef0f4; min-height: 46px; box-sizing: border-box\">\n                <span style=\"{{pr.keyStyle}}\">{{pr.k}}<\u002Fspan>\n                <span style=\"font-weight: 500\">{{pr.label}}<\u002Fspan>\n                <span style=\"font-size: 12px; color: #5b6474\">{{pr.text}}<\u002Fspan>\n                <sc-if value=\"{{pr.canDeclare}}\"><button sc-camel-on-click=\"{{pr.onDeclare}}\" style=\"height: 30px; border: 1px solid #c3cad6; border-radius: 6px; background: #ffffff; padding: 0 10px; font-size: 12px\">Declare<\u002Fbutton><\u002Fsc-if>\n                <sc-if value=\"{{pr.canRemove}}\"><button sc-camel-on-click=\"{{pr.onRemove}}\" style=\"height: 30px; border: 0; background: transparent; padding: 0 10px; font-size: 12px; text-decoration: underline; color: #44506a\">Not relevant<\u002Fbutton><\u002Fsc-if>\n                <sc-if value=\"{{pr.locked}}\"><span style=\"font-size: 11px; color: #7a8291\">in use · remove links first<\u002Fspan><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsection>\n        <\u002Fsc-if>\n\n        <!-- ITEM overview -->\n        <sc-if value=\"{{isItemOv}}\">\n          <div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px\">\n            <sc-for list=\"{{counts}}\" as=\"c\" hint-placeholder-count=\"4\">\n              <div style=\"border: 1px solid #dde2ea; border-radius: 10px; padding: 12px 14px\">\n                <div style=\"font-size: 11px; color: #6b7383\">{{c.label}}<\u002Fdiv>\n                <div style=\"font-size: 22px; font-weight: 600; margin-top: 2px\">{{c.n}}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <section style=\"border: 1px solid #dde2ea; border-radius: 10px; overflow: hidden\">\n            <div style=\"display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: #f5f7fa; border-bottom: 1px solid #dde2ea\">\n              <h2 style=\"margin: 0; font-size: 13px; font-weight: 600\">Next useful work<\u002Fh2>\n              <span style=\"font-size: 11px; color: #7a8291\">no fixed order · pick what unblocks the most<\u002Fspan>\n              <div style=\"flex: 1\"><\u002Fdiv>\n              <button sc-camel-on-click=\"{{goReview}}\" style=\"height: 30px; border: 0; background: transparent; font-size: 12px; text-decoration: underline; color: #44506a\">All findings ({{findingCount}})<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{noWork}}\"><div style=\"padding: 12px 14px; font-size: 12px; color: #7a8291\">Nothing open in this item yet. Start with the definition or a first asset.<\u002Fdiv><\u002Fsc-if>\n            <sc-for list=\"{{nextWork}}\" as=\"w\" hint-placeholder-count=\"3\">\n              <div class=\"rrow\" style=\"display: flex; align-items: center; gap: 12px; padding: 6px 10px 6px 14px; border-top: 1px solid #eef0f4; min-height: 44px; box-sizing: border-box\">\n                <span style=\"width: 48px; flex: none; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5b6474\">{{w.id}}<\u002Fspan>\n                <span style=\"flex: 1\">{{w.text}}<\u002Fspan>\n                <button sc-camel-on-click=\"{{w.onAct}}\" style=\"height: 30px; border: 1px solid #c3cad6; border-radius: 6px; background: #ffffff; padding: 0 10px; font-size: 12px\">{{w.act}}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsection>\n          <section style=\"border: 1px dashed #a9b1bf; border-radius: 10px; overflow: hidden\">\n            <div style=\"display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: #fafbfc; border-bottom: 1px dashed #c5ccd8\">\n              <h2 style=\"margin: 0; font-size: 13px; font-weight: 600\">Unassigned in this item<\u002Fh2>\n              <span style=\"font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 9px; background: #e1e6ed; color: #44506a\">{{unCount}}<\u002Fspan>\n              <span style=\"font-size: 11px; color: #7a8291\">valid drafts, not yet linked into the hierarchy<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{unEmpty}}\"><div style=\"padding: 12px 14px; font-size: 12px; color: #7a8291\">Nothing unassigned.<\u002Fdiv><\u002Fsc-if>\n            <sc-for list=\"{{unList}}\" as=\"u\" hint-placeholder-count=\"2\">\n              <div class=\"rrow\" style=\"display: flex; align-items: center; gap: 12px; padding: 6px 10px 6px 14px; border-top: 1px solid #eef0f4; min-height: 44px; box-sizing: border-box\">\n                <span style=\"width: 120px; flex: none; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: #6b7383\">{{u.type}}<\u002Fspan>\n                <span style=\"width: 48px; flex: none; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5b6474\">{{u.id}}<\u002Fspan>\n                <span style=\"flex: 1; font-weight: 500\">{{u.name}}<\u002Fspan>\n                <button sc-camel-on-click=\"{{u.onAssign}}\" style=\"height: 30px; border: 1px solid #c3cad6; border-radius: 6px; background: #ffffff; padding: 0 10px; font-size: 12px\">{{u.assignLabel}}<\u002Fbutton>\n                <button sc-camel-on-click=\"{{u.onOpen}}\" style=\"height: 30px; border: 0; background: transparent; padding: 0 8px; font-size: 12px; text-decoration: underline; color: #44506a\">Open<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsection>\n        <\u002Fsc-if>\n\n        <!-- ITEM assets -->\n        <sc-if value=\"{{isItemAssets}}\">\n          <div style=\"display: flex; align-items: center; gap: 10px\">\n            <span style=\"font-size: 12px; color: #5b6474; flex: 1\">Assets belong to this item. Their links are edited on each asset's Relations tab.<\u002Fspan>\n            <button sc-camel-on-click=\"{{addAsset}}\" style=\"height: 32px; border: 0; border-radius: 6px; background: #44506a; color: #ffffff; padding: 0 12px; font-size: 12px; font-weight: 600\">+ Add Asset<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"border: 1px solid #dde2ea; border-radius: 10px; overflow: hidden\">\n            <div style=\"display: grid; grid-template-columns: 60px minmax(0, 1.4fr) minmax(0, 1.2fr) 110px 70px 70px 90px; gap: 10px; padding: 8px 14px; background: #f5f7fa; font-size: 11px; color: #5b6474; border-bottom: 1px solid #dde2ea\">\n              <span>ID<\u002Fspan><span>Asset<\u002Fspan><span>Component / interface<\u002Fspan><span>Properties<\u002Fspan><span>Damage<\u002Fspan><span>Threats<\u002Fspan><span>Max related<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{noAssets}}\"><div style=\"padding: 12px 14px; font-size: 12px; color: #7a8291\">No assets yet.<\u002Fdiv><\u002Fsc-if>\n            <sc-for list=\"{{assetRows}}\" as=\"ar\" hint-placeholder-count=\"3\">\n              <button class=\"rrow\" sc-camel-on-click=\"{{ar.onOpen}}\" style=\"width: 100%; display: grid; grid-template-columns: 60px minmax(0, 1.4fr) minmax(0, 1.2fr) 110px 70px 70px 90px; gap: 10px; align-items: center; padding: 10px 14px; border: 0; border-top: 1px solid #eef0f4; background: transparent; text-align: left; font-size: 13px\">\n                <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5b6474\">{{ar.id}}<\u002Fspan>\n                <span style=\"font-weight: 500\">{{ar.name}}<\u002Fspan>\n                <span style=\"color: #5b6474\">{{ar.comp}}<\u002Fspan>\n                <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px\">{{ar.props}}<\u002Fspan>\n                <span>{{ar.ds}}<\u002Fspan>\n                <span>{{ar.ts}}<\u002Fspan>\n                <span><span style=\"{{ar.riskStyle}}\">{{ar.risk}}<\u002Fspan><\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- ASSET-BASED RISK TABLE (item and asset) -->\n        <sc-if value=\"{{isAssetRisk}}\">\n          <div style=\"font-size: 12px; color: #5b6474\">{{arNote}}<\u002Fdiv>\n          <div style=\"border: 1px solid #dde2ea; border-radius: 10px; overflow: hidden\">\n            <div style=\"{{arGrid}} padding: 8px 14px; background: #f5f7fa; border-bottom: 1px solid #dde2ea; font-size: 11px; color: #5b6474\">\n              <span>Property<\u002Fspan><span>Damage scenario<\u002Fspan><span>Threat scenario<\u002Fspan><span>Feasibility<\u002Fspan><span>Risk<\u002Fspan><span>Treatment<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{arEmpty}}\"><div style=\"padding: 12px 14px; font-size: 12px; color: #7a8291\">Nothing to show yet.<\u002Fdiv><\u002Fsc-if>\n            <sc-for list=\"{{arRows}}\" as=\"rk\" hint-placeholder-count=\"5\">\n              <sc-if value=\"{{rk.isHead}}\">\n                <button sc-camel-on-click=\"{{rk.onOpen}}\" style=\"width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 14px; border: 0; border-top: 1px solid #dde2ea; background: #eef1f6; text-align: left; font-size: 13px\">\n                  <span style=\"font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; color: #6b7383\">{{rk.kind}}<\u002Fspan>\n                  <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5b6474\">{{rk.id}}<\u002Fspan>\n                  <span style=\"font-weight: 600\">{{rk.name}}<\u002Fspan>\n                  <span style=\"font-size: 11px; color: #6b7383\">{{rk.sub}}<\u002Fspan>\n                  <span style=\"flex: 1\"><\u002Fspan>\n                  <span style=\"{{rk.riskStyle}}\">{{rk.risk}}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{rk.isRow}}\" hint-placeholder-val=\"{{true}}\">\n                <div class=\"rrow\" style=\"{{rk.grid}}\">\n                  <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; color: #44506a\">{{rk.props}}<\u002Fspan>\n                  <span style=\"min-width: 0\">\n                    <sc-if value=\"{{rk.hasDs}}\"><button class=\"lnk\" sc-camel-on-click=\"{{rk.onDs}}\" style=\"font-size: 13px; font-weight: 500\"><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5b6474\">{{rk.dsId}}<\u002Fspan> {{rk.dsName}}<\u002Fbutton> <span style=\"font-size: 11px; color: #6b7383\">{{rk.dsImpact}}<\u002Fspan><\u002Fsc-if>\n                    <sc-if value=\"{{rk.noDs}}\"><span style=\"font-size: 12px; color: #7a8291\">no damage scenario linked<\u002Fspan><\u002Fsc-if>\n                  <\u002Fspan>\n                  <span style=\"min-width: 0\">\n                    <sc-if value=\"{{rk.hasTs}}\"><button class=\"lnk\" sc-camel-on-click=\"{{rk.onTs}}\" style=\"font-size: 13px; font-weight: 500\"><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5b6474\">{{rk.tsId}}<\u002Fspan> {{rk.tsName}}<\u002Fbutton> <span style=\"{{rk.roleStyle}}\">{{rk.role}}<\u002Fspan><\u002Fsc-if>\n                    <sc-if value=\"{{rk.noTs}}\"><span style=\"font-size: 12px; color: #7a8291\">no threat scenario yet<\u002Fspan><\u002Fsc-if>\n                  <\u002Fspan>\n                  <span style=\"font-size: 12px\">{{rk.feas}}<span style=\"color: #7a8291; font-size: 11px\"> {{rk.feasSub}}<\u002Fspan><\u002Fspan>\n                  <span><span style=\"{{rk.riskStyle}}\">{{rk.risk}}<\u002Fspan><\u002Fspan>\n                  <span><sc-if value=\"{{rk.hasTreat}}\"><button sc-camel-on-click=\"{{rk.onTreat}}\" style=\"{{rk.treatStyle}}\">{{rk.treat}}<\u002Fbutton><\u002Fsc-if><\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size: 11px; color: #6b7383\">targeted = the threat attacks this asset property (RQ-15-03) · via damage = the damage arises from this asset, the attack targets another one · indirect = documented interdependency<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- RISK register (threat scenario, per category) -->\n        <sc-if value=\"{{isRegister}}\">\n          <div style=\"font-size: 12px; color: #5b6474\">{{registerNote}}<\u002Fdiv>\n          <div style=\"border: 1px solid #dde2ea; border-radius: 10px; overflow: hidden\">\n            <div style=\"{{regGrid}} background: #f5f7fa; font-size: 11px; color: #5b6474; border-bottom: 1px solid #dde2ea; padding: 8px 14px\">\n              <sc-if value=\"{{regShowTs}}\"><span>Threat scenario<\u002Fspan><\u002Fsc-if>\n              <span>Damage scenario<\u002Fspan><span>Category<\u002Fspan><span>Impact<\u002Fspan><span>Feasibility<\u002Fspan><span>Risk<\u002Fspan><span>{{regLastHead}}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{noReg}}\"><div style=\"padding: 12px 14px; font-size: 12px; color: #7a8291\">No threat scenarios yet.<\u002Fdiv><\u002Fsc-if>\n            <sc-for list=\"{{regRows}}\" as=\"rr\" hint-placeholder-count=\"3\">\n              <div class=\"rrow\" style=\"{{rr.grid}}\">\n                <sc-if value=\"{{rr.isNA}}\">\n                  <span style=\"grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; color: #5b6474\">\n                    <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px\">{{rr.ts}}<\u002Fspan>\n                    <span style=\"font-weight: 500; color: #1f2633\">{{rr.tsName}}<\u002Fspan>\n                    <span>· Risk N/A: {{rr.reason}}<\u002Fspan>\n                    <span style=\"flex: 1\"><\u002Fspan>\n                    <button sc-camel-on-click=\"{{rr.onOpen}}\" style=\"height: 28px; border: 1px solid #c3cad6; border-radius: 6px; background: #ffffff; padding: 0 10px; font-size: 12px\">Resolve<\u002Fbutton>\n                  <\u002Fspan>\n                <\u002Fsc-if>\n                <sc-if value=\"{{rr.isVal}}\" hint-placeholder-val=\"{{true}}\">\n                  <sc-if value=\"{{regShowTs}}\"><span><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5b6474\">{{rr.ts}}<\u002Fspan> {{rr.tsName}}<\u002Fspan><\u002Fsc-if>\n                  <span><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5b6474\">{{rr.ds}}<\u002Fspan> {{rr.dsName}}<sc-if value=\"{{rr.ctx}}\"><span style=\"font-size: 10px; font-weight: 600; margin-left: 6px; padding: 1px 6px; border-radius: 8px; border: 1px dashed #5f7196; color: #44506a\">context<\u002Fspan><\u002Fsc-if><\u002Fspan>\n                  <span>{{rr.cat}}<\u002Fspan>\n                  <span>{{rr.impact}}<\u002Fspan>\n                  <span>{{rr.feas}}<span style=\"color: #7a8291; font-size: 11px\"> {{rr.feasSub}}<\u002Fspan><\u002Fspan>\n                  <span><span style=\"{{rr.riskStyle}}\">{{rr.risk}}<\u002Fspan><\u002Fspan>\n                  <span><button sc-camel-on-click=\"{{rr.onLast}}\" style=\"{{rr.lastStyle}}\">{{rr.last}}<\u002Fbutton><\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{showCalc}}\">\n            <section style=\"border: 1px solid #98a3b6; border-radius: 10px; padding: 16px 18px; display: flex; gap: 28px; align-items: flex-start\">\n              <div style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; font-size: 13px\">\n                <h2 style=\"margin: 0; font-size: 13px; font-weight: 600\">Calculation<\u002Fh2>\n                <div>{{calc.line1}}<\u002Fdiv>\n                <div>{{calc.line2}}<\u002Fdiv>\n                <div style=\"font-weight: 600\">{{calc.line3}}<\u002Fdiv>\n                <div style=\"font-size: 11px; color: #6b7383\">Profile: Example risk matrix v1 · Feasibility = maximum of rated attack paths (RQ-15-15 Note 2)<\u002Fdiv>\n                <div style=\"display: flex; gap: 8px; margin-top: 4px\">\n                  <button sc-camel-on-click=\"{{calc.goImpact}}\" style=\"height: 30px; border: 1px solid #c3cad6; border-radius: 6px; background: #ffffff; padding: 0 10px; font-size: 12px\">Open impact rating<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{calc.goFeas}}\" disabled=\"{{calc.noFeas}}\" style=\"height: 30px; border: 1px solid #c3cad6; border-radius: 6px; background: #ffffff; padding: 0 10px; font-size: 12px\">Open feasibility rating<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display: grid; grid-template-columns: 90px repeat(4, 54px); gap: 3px; font-size: 11px; flex: none\">\n                <span><\u002Fspan><span style=\"text-align: center; color: #5b6474\">Very low<\u002Fspan><span style=\"text-align: center; color: #5b6474\">Low<\u002Fspan><span style=\"text-align: center; color: #5b6474\">Medium<\u002Fspan><span style=\"text-align: center; color: #5b6474\">High<\u002Fspan>\n                <sc-for list=\"{{matrix}}\" as=\"mx\" hint-placeholder-count=\"4\">\n                  <span style=\"color: #5b6474; align-self: center\">{{mx.label}}<\u002Fspan>\n                  <sc-for list=\"{{mx.cells}}\" as=\"cell\" hint-placeholder-count=\"4\"><span style=\"{{cell.style}}\">{{cell.v}}<\u002Fspan><\u002Fsc-for>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsection>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n\n        <!-- REVIEW -->\n        <sc-if value=\"{{isReview}}\">\n          <div style=\"font-size: 12px; color: #5b6474\">Structural gaps and open ratings in this item. An empty list does not prove complete threat coverage.<\u002Fdiv>\n          <sc-if value=\"{{noFindings}}\"><div style=\"border: 1px dashed #c5ccd8; border-radius: 10px; padding: 20px; font-size: 12px; color: #7a8291\">No findings.<\u002Fdiv><\u002Fsc-if>\n          <sc-for list=\"{{reviewGroups}}\" as=\"rg\" hint-placeholder-count=\"3\">\n            <section style=\"border: 1px solid #dde2ea; border-radius: 10px; overflow: hidden\">\n              <div style=\"display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: #f5f7fa; border-bottom: 1px solid #dde2ea\">\n                <h2 style=\"margin: 0; font-size: 13px; font-weight: 600\">{{rg.title}}<\u002Fh2>\n                <span style=\"font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 9px; background: #e1e6ed; color: #44506a\">{{rg.count}}<\u002Fspan>\n                <span style=\"font-size: 11px; color: #7a8291\">{{rg.hint}}<\u002Fspan>\n              <\u002Fdiv>\n              <sc-for list=\"{{rg.items}}\" as=\"fi\" hint-placeholder-count=\"2\">\n                <div class=\"rrow\" style=\"display: flex; align-items: center; gap: 12px; padding: 6px 10px 6px 14px; border-top: 1px solid #eef0f4; min-height: 44px; box-sizing: border-box\">\n                  <span style=\"width: 48px; flex: none; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5b6474\">{{fi.id}}<\u002Fspan>\n                  <span style=\"flex: 1\">{{fi.text}}<\u002Fspan>\n                  <button sc-camel-on-click=\"{{fi.onAct}}\" style=\"height: 30px; border: 1px solid #c3cad6; border-radius: 6px; background: #ffffff; padding: 0 10px; font-size: 12px\">{{fi.act}}<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fsection>\n          <\u002Fsc-for>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{showCards}}\">\n          <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px\">\n            <sc-for list=\"{{cards}}\" as=\"cd\" hint-placeholder-count=\"3\">\n              <div style=\"border: 1px solid #dde2ea; border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px\">\n                <div style=\"font-size: 11px; color: #6b7383\">{{cd.label}}<\u002Fdiv>\n                <div><span style=\"{{cd.style}}\">{{cd.value}}<\u002Fspan><\u002Fdiv>\n                <div style=\"font-size: 11px; color: #5b6474\">{{cd.sub}}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-for list=\"{{ovLists}}\" as=\"ol\" hint-placeholder-count=\"0\">\n          <section style=\"border: 1px solid #dde2ea; border-radius: 10px; overflow: hidden\">\n            <div style=\"display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: #f5f7fa; border-bottom: 1px solid #dde2ea\">\n              <h2 style=\"margin: 0; font-size: 13px; font-weight: 600\">{{ol.title}}<\u002Fh2>\n              <span style=\"font-size: 11px; color: #7a8291\">{{ol.hint}}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ol.empty}}\"><div style=\"padding: 12px 14px; font-size: 12px; color: #7a8291\">{{ol.emptyText}}<\u002Fdiv><\u002Fsc-if>\n            <sc-for list=\"{{ol.rows}}\" as=\"li\" hint-placeholder-count=\"2\">\n              <div class=\"rrow\" style=\"display: flex; align-items: center; gap: 12px; padding: 6px 10px 6px 14px; border-top: 1px solid #eef0f4; min-height: 42px; box-sizing: border-box\">\n                <span style=\"width: 48px; flex: none; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5b6474\">{{li.id}}<\u002Fspan>\n                <button class=\"lnk\" sc-camel-on-click=\"{{li.onOpen}}\" style=\"flex: 1; min-width: 0; font-size: 13px; font-weight: 500\">{{li.name}}<\u002Fbutton>\n                <span style=\"font-size: 12px; color: #5b6474\">{{li.info}}<\u002Fspan>\n                <sc-if value=\"{{li.hasTag}}\"><span style=\"{{li.tagStyle}}\">{{li.tag}}<\u002Fspan><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsection>\n        <\u002Fsc-for>\n\n        <!-- DS impact -->\n        <sc-if value=\"{{isImpact}}\">\n          <div style=\"font-size: 12px; color: #5b6474\">Rate each impact category (RQ-15-05). “Unassessed” means open; “Omitted” is a justified decision (PM-15-07); neither equals “Negligible”.<\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px\">\n            <sc-for list=\"{{impCards}}\" as=\"ic\" hint-placeholder-count=\"4\">\n              <fieldset style=\"{{ic.style}}\">\n                <legend style=\"padding: 0 6px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px\">{{ic.cat}}<\u002Flegend>\n                <div style=\"display: flex; flex-wrap: wrap; gap: 4px 14px\">\n                  <sc-for list=\"{{ic.opts}}\" as=\"op\" hint-placeholder-count=\"6\">\n                    <label style=\"display: flex; align-items: center; gap: 6px; font-size: 12px; min-height: 28px\"><input type=\"radio\" name=\"{{ic.name}}\" checked=\"{{op.on}}\" sc-camel-on-change=\"{{op.pick}}\" sc-camel-on-focus=\"{{ic.onFocus}}\">{{op.label}}<\u002Flabel>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <textarea sc-camel-read-only=\"{{true}}\" rows=\"2\" value=\"{{ic.why}}\" placeholder=\"{{ic.ph}}\" style=\"margin-top: 10px; width: 100%; box-sizing: border-box; border: 1px solid #cdd3dc; border-radius: 6px; padding: 6px 8px; font-size: 12px; resize: none; background: #ffffff\"><\u002Ftextarea>\n              <\u002Ffieldset>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size: 12px; color: #44506a\">{{impAffects}}<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- TS: damage scenarios & exploited causes -->\n        <sc-if value=\"{{isThreat}}\">\n          <section style=\"border: 1px solid #dde2ea; border-radius: 10px; overflow: hidden\">\n            <div style=\"display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 14px; background: #f5f7fa; border-bottom: 1px solid #dde2ea\">\n              <div style=\"flex: 1; min-width: 0\">\n                <h2 style=\"margin: 0; font-size: 13px; font-weight: 600\">Damage Scenarios &amp; Targets<\u002Fh2>\n                <div style=\"font-size: 11px; color: #6b7383; margin-top: 2px\">Which cause of the damage does this attack exploit? The ticked asset · property is the threat's target (RQ-15-03). One property per asset.<\u002Fdiv>\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{addDsToTs}}\" style=\"height: 30px; flex: none; border: 1px solid #c3cad6; border-radius: 6px; background: #ffffff; padding: 0 10px; font-size: 12px\">+ Add Damage Scenario<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{noDsBlocks}}\"><div style=\"padding: 12px 14px; font-size: 12px; color: #7a8291\">No damage scenario linked yet. You can still name a target below (threat first); the risk stays open until a damage scenario is linked.<\u002Fdiv><\u002Fsc-if>\n            <sc-for list=\"{{dsBlocks}}\" as=\"db\" hint-placeholder-count=\"2\">\n              <div style=\"border-top: 1px solid #eef0f4; padding: 10px 14px 12px\">\n                <div style=\"display: flex; align-items: center; gap: 10px\">\n                  <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5b6474\">{{db.id}}<\u002Fspan>\n                  <button class=\"lnk\" sc-camel-on-click=\"{{db.onOpen}}\" style=\"font-size: 13px\">{{db.name}}<\u002Fbutton>\n                  <span style=\"font-size: 12px; color: #5b6474\">{{db.impact}}<\u002Fspan>\n                  <sc-if value=\"{{db.hasFlag}}\"><span style=\"{{db.flagStyle}}\">{{db.flag}}<\u002Fspan><\u002Fsc-if>\n                  <div style=\"flex: 1\"><\u002Fdiv>\n                  <span style=\"{{db.riskStyle}}\">{{db.risk}}<\u002Fspan>\n                  <button aria-label=\"{{db.unlinkLabel}}\" title=\"Remove link (objects are kept)\" sc-camel-on-click=\"{{db.onAskUnlink}}\" style=\"width: 30px; height: 30px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0; color: #6b7383\">\n                    <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 12 12\" aria-hidden=\"true\"><path d=\"M3 3l6 6M9 3l-6 6\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fbutton>\n                <\u002Fdiv>\n                <sc-if value=\"{{db.confirming}}\">\n                  <div style=\"display: flex; align-items: center; gap: 10px; margin: 6px 0 0; padding: 8px 10px; border-radius: 8px; background: #fffaf0; border: 1px solid #e2c48f; font-size: 12px\">\n                    <span style=\"flex: 1\">{{db.confirmText}}<\u002Fspan>\n                    <button sc-camel-on-click=\"{{db.onCancel}}\" style=\"height: 28px; border: 0; background: transparent; padding: 0 8px; font-size: 12px; color: #44506a\">Cancel<\u002Fbutton>\n                    <button sc-camel-on-click=\"{{db.onConfirm}}\" style=\"height: 28px; border: 0; border-radius: 6px; background: #44506a; color: #ffffff; padding: 0 10px; font-size: 12px; font-weight: 600\">Remove link<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"margin: 8px 0 0 0; padding-left: 14px; border-left: 2px solid #e1e6ed; display: flex; flex-direction: column; gap: 4px\">\n                  <div style=\"font-size: 11px; color: #6b7383\">Possible targets (causes of this damage):<\u002Fdiv>\n                  <sc-if value=\"{{db.noCauses}}\"><div style=\"font-size: 12px; color: #7a8291\">This damage scenario has no asset cause yet. Add one on the damage scenario, or name an indirect target.<\u002Fdiv><\u002Fsc-if>\n                  <sc-for list=\"{{db.causes}}\" as=\"ca\" hint-placeholder-count=\"2\">\n                    <label style=\"display: flex; align-items: center; gap: 8px; min-height: 30px; font-size: 13px\">\n                      <input type=\"checkbox\" checked=\"{{ca.on}}\" sc-camel-on-change=\"{{ca.toggle}}\">\n                      <span style=\"{{ca.keyStyle}}\">{{ca.p}}<\u002Fspan>\n                      <span><span style=\"font-weight: 500\">{{ca.asset}}<\u002Fspan> <span style=\"color: #5b6474\">· {{ca.prop}}<\u002Fspan><\u002Fspan>\n                      <sc-if value=\"{{ca.hasNote}}\"><span style=\"font-size: 11px; color: #7a8291\">{{ca.note}}<\u002Fspan><\u002Fsc-if>\n                    <\u002Flabel>\n                  <\u002Fsc-for>\n                  <sc-for list=\"{{db.indirect}}\" as=\"ind\" hint-placeholder-count=\"0\">\n                    <div style=\"display: flex; align-items: center; gap: 8px; min-height: 30px; font-size: 13px\">\n                      <span style=\"font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 8px; background: #eceef2; color: #2c3547\">indirect<\u002Fspan>\n                      <span><span style=\"font-weight: 500\">{{ind.asset}}<\u002Fspan> <span style=\"color: #5b6474\">· {{ind.prop}}<\u002Fspan><\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <sc-if value=\"{{db.isIndirect}}\">\n                    <label style=\"display: flex; align-items: center; gap: 8px; font-size: 11px; color: #6b7383\">Indirect via\n                      <input value=\"{{db.note}}\" sc-camel-on-change=\"{{db.onNote}}\" placeholder=\"e.g. compromised update package leads to compromised CMC firmware\" style=\"flex: 1; height: 28px; box-sizing: border-box; border: 1px solid #cdd3dc; border-radius: 6px; padding: 0 8px; font-size: 12px; color: #1f2633\">\n                    <\u002Flabel>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{db.mismatch}}\">\n                    <div style=\"display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; background: #fffaf0; border: 1px solid #e2c48f; font-size: 12px\">\n                      <span style=\"flex: 1\">{{db.mismatchText}}<\u002Fspan>\n                      <button sc-camel-on-click=\"{{db.onAddCause}}\" style=\"height: 28px; border: 1px solid #c3cad6; border-radius: 6px; background: #ffffff; padding: 0 10px; font-size: 12px\">{{db.addCauseLabel}}<\u002Fbutton>\n                      <button sc-camel-on-click=\"{{db.onMarkIndirect}}\" style=\"height: 28px; border: 1px solid #c3cad6; border-radius: 6px; background: #ffffff; padding: 0 10px; font-size: 12px\">Indirect effect…<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <button sc-camel-on-click=\"{{db.onOther}}\" style=\"align-self: flex-start; height: 28px; border: 0; background: transparent; padding: 0; font-size: 12px; color: #44506a; text-decoration: underline\">+ Other asset (indirect effect)…<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsection>\n\n          <sc-if value=\"{{showFreeTargets}}\">\n            <section style=\"border: 1px dashed #a9b1bf; border-radius: 10px; overflow: hidden\">\n              <div style=\"display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 14px; background: #fafbfc; border-bottom: 1px dashed #c5ccd8\">\n                <div style=\"flex: 1\">\n                  <h2 style=\"margin: 0; font-size: 13px; font-weight: 600\">{{freeTitle}}<\u002Fh2>\n                  <div style=\"font-size: 11px; color: #6b7383; margin-top: 2px\">{{freeHint}}<\u002Fdiv>\n                <\u002Fdiv>\n                <button sc-camel-on-click=\"{{addFreeTarget}}\" style=\"height: 30px; border: 1px solid #c3cad6; border-radius: 6px; background: #ffffff; padding: 0 10px; font-size: 12px\">+ Add Asset<\u002Fbutton>\n              <\u002Fdiv>\n              <sc-if value=\"{{noFree}}\"><div style=\"padding: 12px 14px; font-size: 12px; color: #7a8291\">No target yet. Pick an existing asset or create one from this threat.<\u002Fdiv><\u002Fsc-if>\n              <sc-for list=\"{{freeTargets}}\" as=\"ft\" hint-placeholder-count=\"1\">\n                <div style=\"display: flex; align-items: center; gap: 12px; padding: 6px 10px 6px 14px; border-top: 1px solid #eef0f4; min-height: 46px; box-sizing: border-box\">\n                  <span style=\"width: 48px; flex: none; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5b6474\">{{ft.id}}<\u002Fspan>\n                  <button class=\"lnk\" sc-camel-on-click=\"{{ft.onOpen}}\" style=\"flex: 1; min-width: 0; font-size: 13px\">{{ft.name}}<\u002Fbutton>\n                  <span role=\"radiogroup\" aria-label=\"Compromised property\" style=\"display: inline-flex; gap: 3px\">\n                    <sc-for list=\"{{ft.chips}}\" as=\"cp\" hint-placeholder-count=\"3\"><button role=\"radio\" aria-checked=\"{{cp.on}}\" aria-label=\"{{cp.label}}\" sc-camel-on-click=\"{{cp.toggle}}\" style=\"{{cp.style}}\">{{cp.k}}<\u002Fbutton><\u002Fsc-for>\n                  <\u002Fspan>\n                  <button aria-label=\"{{ft.removeLabel}}\" sc-camel-on-click=\"{{ft.onRemove}}\" style=\"width: 30px; height: 30px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0; color: #6b7383\">\n                    <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 12 12\" aria-hidden=\"true\"><path d=\"M3 3l6 6M9 3l-6 6\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fsection>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n\n        <!-- TS treatment coverage -->\n        <sc-if value=\"{{isTreat}}\">\n          <div style=\"font-size: 12px; color: #5b6474\">One decision per threat scenario that covers each of its risk values (RQ-15-17). Usually one option applies to all; deviate per row where needed.<\u002Fdiv>\n          <sc-if value=\"{{noTreatRows}}\"><div style=\"border: 1px dashed #c5ccd8; border-radius: 10px; padding: 20px; font-size: 12px; color: #7a8291\">No risk values yet. Link a damage scenario with a rated impact and a rated attack path first.<\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{hasTreatRows}}\">\n            <div style=\"border: 1px solid #dde2ea; border-radius: 10px; overflow: hidden\">\n              <div style=\"display: grid; grid-template-columns: minmax(0, 1.6fr) 60px repeat(4, 70px) minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 14px; background: #f5f7fa; border-bottom: 1px solid #dde2ea; font-size: 11px; color: #5b6474\">\n                <span>Risk value<\u002Fspan><span>Risk<\u002Fspan><span style=\"text-align: center\">Avoid<\u002Fspan><span style=\"text-align: center\">Reduce<\u002Fspan><span style=\"text-align: center\">Share<\u002Fspan><span style=\"text-align: center\">Retain<\u002Fspan><span>Status<\u002Fspan>\n              <\u002Fdiv>\n              <sc-for list=\"{{treatRows}}\" as=\"tw\" hint-placeholder-count=\"3\">\n                <div style=\"{{tw.grid}}\">\n                  <span style=\"{{tw.labelStyle}}\">{{tw.label}}<\u002Fspan>\n                  <span><sc-if value=\"{{tw.hasRisk}}\"><span style=\"{{tw.riskStyle}}\">{{tw.risk}}<\u002Fspan><\u002Fsc-if><\u002Fspan>\n                  <sc-for list=\"{{tw.opts}}\" as=\"tc\" hint-placeholder-count=\"4\">\n                    <span style=\"display: flex; justify-content: center\"><input type=\"checkbox\" aria-label=\"{{tc.label}}\" checked=\"{{tc.on}}\" sc-camel-on-change=\"{{tc.toggle}}\" style=\"width: 18px; height: 18px\"><\u002Fspan>\n                  <\u002Fsc-for>\n                  <span style=\"{{tw.statusStyle}}\">{{tw.status}}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-for list=\"{{treatLists}}\" as=\"tl\" hint-placeholder-count=\"2\">\n            <section style=\"border: 1px solid #dde2ea; border-radius: 10px; overflow: hidden\">\n              <div style=\"display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 14px; background: #f5f7fa; border-bottom: 1px solid #dde2ea\">\n                <h2 style=\"margin: 0; font-size: 13px; font-weight: 600\">{{tl.title}}<\u002Fh2>\n                <span style=\"font-size: 11px; color: #7a8291\">{{tl.hint}}<\u002Fspan>\n                <div style=\"flex: 1\"><\u002Fdiv>\n                <button style=\"height: 30px; border: 1px solid #c3cad6; border-radius: 6px; background: #ffffff; padding: 0 10px; font-size: 12px\">{{tl.add}}<\u002Fbutton>\n              <\u002Fdiv>\n              <sc-if value=\"{{tl.empty}}\"><div style=\"padding: 12px 14px; font-size: 12px; color: #7a8291\">{{tl.emptyText}}<\u002Fdiv><\u002Fsc-if>\n              <sc-for list=\"{{tl.rows}}\" as=\"tr\" hint-placeholder-count=\"1\">\n                <div style=\"display: flex; gap: 12px; padding: 10px 14px; border-top: 1px solid #eef0f4; font-size: 13px\">\n                  <span style=\"width: 70px; flex: none; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5b6474\">{{tr.id}}<\u002Fspan>\n                  <span style=\"flex: 1\">{{tr.text}}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fsection>\n          <\u002Fsc-for>\n          <div style=\"font-size: 11px; color: #6b7383\">Recorded requirements are not evidence that a control is implemented or effective. A recalculated risk value is never a confirmed decision.<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- AP steps -->\n        <sc-if value=\"{{isPath}}\">\n          <section style=\"border: 1px solid #dde2ea; border-radius: 10px; overflow: hidden\">\n            <div style=\"display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 14px; background: #f5f7fa; border-bottom: 1px solid #dde2ea\">\n              <h2 style=\"margin: 0; font-size: 13px; font-weight: 600\">Attack steps<\u002Fh2>\n              <span style=\"font-size: 11px; color: #7a8291\">ordered list of attacker actions<\u002Fspan>\n              <div style=\"flex: 1\"><\u002Fdiv>\n              <button style=\"height: 30px; border: 1px solid #c3cad6; border-radius: 6px; background: #ffffff; padding: 0 10px; font-size: 12px\">+ Add step<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{noSteps}}\"><div style=\"padding: 12px 14px; font-size: 12px; color: #7a8291\">No steps yet.<\u002Fdiv><\u002Fsc-if>\n            <sc-for list=\"{{steps}}\" as=\"sp\" hint-placeholder-count=\"3\">\n              <div style=\"display: flex; gap: 12px; align-items: flex-start; padding: 10px 14px; border-top: 1px solid #eef0f4; font-size: 13px\">\n                <span style=\"width: 22px; height: 22px; flex: none; border-radius: 11px; background: #e1e6ed; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600\">{{sp.n}}<\u002Fspan>\n                <span style=\"flex: 1; line-height: 1.45\">{{sp.text}}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsection>\n        <\u002Fsc-if>\n\n        <!-- AP feasibility -->\n        <sc-if value=\"{{isFeas}}\">\n          <section style=\"border: 1px solid #dde2ea; border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px\">\n            <div style=\"display: flex; align-items: center; gap: 10px; flex-wrap: wrap\">\n              <span style=\"font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px\">Rating method\n              <\u002Fspan>\n              <div role=\"radiogroup\" aria-label=\"Attack feasibility rating method\" style=\"display: inline-flex; border: 1px solid #c3cad6; border-radius: 8px; overflow: hidden\">\n                <sc-for list=\"{{methods}}\" as=\"me\" hint-placeholder-count=\"3\">\n                  <button role=\"radio\" aria-checked=\"{{me.on}}\" sc-camel-on-click=\"{{me.onPick}}\" sc-camel-on-focus=\"{{methodFocus}}\" style=\"{{me.style}}\">{{me.label}}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-if value=\"{{methodDiffers}}\"><span style=\"font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 8px; border: 1px solid #c58b2b; color: #7a4d0b; background: #fff8ec\">differs from project default<\u002Fspan><\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"font-size: 12px; color: #5b6474\">{{methodNote}}<\u002Fdiv>\n          <\u002Fsection>\n\n          <sc-if value=\"{{feasHasTable}}\">\n            <div style=\"border: 1px solid #dde2ea; border-radius: 10px; overflow: hidden\">\n              <sc-for list=\"{{factors}}\" as=\"fx\" hint-placeholder-count=\"5\">\n                <div style=\"display: grid; grid-template-columns: 220px minmax(0, 1fr) 70px; gap: 12px; align-items: center; padding: 8px 14px; border-top: 1px solid #eef0f4; min-height: 46px; box-sizing: border-box\">\n                  <span style=\"display: flex; align-items: center; gap: 6px\">\n                    <label for=\"{{fx.key}}\" style=\"font-size: 13px; font-weight: 500\">{{fx.label}}<\u002Flabel>\n                  <\u002Fspan>\n                  <sc-raw-select id=\"{{fx.key}}\" value=\"{{fx.value}}\" sc-camel-on-change=\"{{fx.onChange}}\" sc-camel-on-focus=\"{{fx.onFocus}}\" style=\"height: 32px; border: 1px solid #cdd3dc; border-radius: 6px; padding: 0 8px; font-size: 13px; background: #ffffff; color: #1f2633; max-width: 320px\">\n                    <option value=\"\">Not rated<\u002Foption>\n                    <sc-for list=\"{{fx.opts}}\" as=\"fo\" hint-placeholder-count=\"4\"><option value=\"{{fo.v}}\">{{fo.label}}<\u002Foption><\u002Fsc-for>\n                  <\u002Fsc-raw-select>\n                  <span style=\"text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 13px\">{{fx.pts}}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"display: grid; grid-template-columns: 220px minmax(0, 1fr) 70px; gap: 12px; align-items: center; padding: 12px 14px; border-top: 1px solid #dde2ea; background: #f5f7fa\">\n                <span style=\"font-weight: 600\">{{feasTotalLabel}}<\u002Fspan>\n                <span><span style=\"{{feasStyle}}\">{{feasText}}<\u002Fspan><\u002Fspan>\n                <span style=\"text-align: right; font-family: 'IBM Plex Mono', monospace; font-weight: 600\">{{feasTotal}}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{feasIsVector}}\">\n            <fieldset style=\"border: 1px solid #dde2ea; border-radius: 10px; padding: 6px 0 0; margin: 0; overflow: hidden\">\n              <legend style=\"padding: 0 6px; margin-left: 10px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px\">Attack vector\n              <\u002Flegend>\n              <sc-for list=\"{{vectors}}\" as=\"ve\" hint-placeholder-count=\"4\">\n                <label style=\"{{ve.style}}\">\n                  <input type=\"radio\" name=\"{{ve.name}}\" checked=\"{{ve.on}}\" sc-camel-on-change=\"{{ve.onPick}}\" sc-camel-on-focus=\"{{vecFocus}}\">\n                  <span style=\"flex: 1; display: flex; flex-direction: column; gap: 1px\">\n                    <span style=\"font-weight: 600\">{{ve.label}}<\u002Fspan>\n                    <span style=\"font-size: 12px; color: #5b6474\">{{ve.desc}}<\u002Fspan>\n                  <\u002Fspan>\n                  <span style=\"{{ve.ratingStyle}}\">{{ve.rating}}<\u002Fspan>\n                <\u002Flabel>\n              <\u002Fsc-for>\n            <\u002Ffieldset>\n          <\u002Fsc-if>\n\n          <div style=\"font-size: 11px; color: #6b7383\">{{feasMapping}}<\u002Fdiv>\n          <label style=\"display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: #5b6474\">Rationale and evidence\n            <textarea rows=\"2\" placeholder=\"Why these values? Reference vulnerability analysis, tests or assumptions.\" style=\"box-sizing: border-box; border: 1px solid #cdd3dc; border-radius: 6px; padding: 8px 10px; font-size: 13px; color: #1f2633; resize: none\"><\u002Ftextarea>\n          <\u002Flabel>\n        <\u002Fsc-if>\n\n        <!-- RELATIONS -->\n        <sc-if value=\"{{isRel}}\">\n          <sc-for list=\"{{groups}}\" as=\"g\" hint-placeholder-count=\"3\">\n            <section style=\"{{g.box}}\">\n              <div style=\"display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 14px; background: #f5f7fa; border-bottom: 1px solid #dde2ea\">\n                <span style=\"font-size: 13px; color: #5b6474; width: 14px\" aria-hidden=\"true\">{{g.arrow}}<\u002Fspan>\n                <h2 style=\"margin: 0; font-size: 13px; font-weight: 600\">{{g.title}}<\u002Fh2>\n                <span style=\"font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 9px; background: #e1e6ed; color: #44506a\">{{g.count}}<\u002Fspan>\n                <span style=\"font-size: 11px; color: #7a8291\">{{g.hint}}<\u002Fspan>\n                <div style=\"flex: 1\"><\u002Fdiv>\n                <sc-if value=\"{{g.canLink}}\"><button sc-camel-on-click=\"{{g.onLink}}\" style=\"height: 30px; border: 1px solid #c3cad6; border-radius: 6px; background: #ffffff; padding: 0 10px; font-size: 12px\">+ {{g.linkLabel}}<\u002Fbutton><\u002Fsc-if>\n              <\u002Fdiv>\n              <sc-if value=\"{{g.empty}}\"><div style=\"padding: 12px 14px; font-size: 12px; color: #7a8291\">{{g.emptyText}}<\u002Fdiv><\u002Fsc-if>\n              <sc-for list=\"{{g.rows}}\" as=\"r\" hint-placeholder-count=\"2\">\n                <div sc-camel-on-mouse-enter=\"{{r.onEnter}}\" sc-camel-on-mouse-leave=\"{{r.onLeave}}\" style=\"border-top: 1px solid #eef0f4\">\n                  <div class=\"rrow\" style=\"display: flex; align-items: center; gap: 12px; padding: 6px 10px 6px 14px; min-height: 46px; box-sizing: border-box\">\n                    <span style=\"width: 48px; flex: none; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5b6474\">{{r.id}}<\u002Fspan>\n                    <div style=\"flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; line-height: 1.5\">\n                      <sc-if value=\"{{r.hasPre}}\"><span style=\"color: #44506a\">{{r.pre}}<\u002Fspan><\u002Fsc-if>\n                      <sc-if value=\"{{r.hasChips}}\">\n                        <span role=\"group\" aria-label=\"{{r.chipsLabel}}\" style=\"display: inline-flex; gap: 3px\">\n                          <sc-for list=\"{{r.chips}}\" as=\"cp\" hint-placeholder-count=\"3\"><button aria-label=\"{{cp.label}}\" aria-pressed=\"{{cp.on}}\" title=\"{{cp.label}}\" sc-camel-on-click=\"{{cp.toggle}}\" style=\"{{cp.style}}\">{{cp.k}}<\u002Fbutton><\u002Fsc-for>\n                        <\u002Fspan>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{r.hasMid}}\"><span style=\"color: #44506a\">{{r.mid}}<\u002Fspan><\u002Fsc-if>\n                      <button class=\"lnk\" sc-camel-on-click=\"{{r.onOpen}}\" style=\"font-size: 13px\">{{r.name}}<\u002Fbutton>\n
