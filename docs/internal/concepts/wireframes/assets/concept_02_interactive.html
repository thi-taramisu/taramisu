urrentColor\" stroke-width=\"1.1\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n              Assistant\n            <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{gtabGuide}}\" hint-placeholder-val=\"{{true}}\">\n        <div style=\"flex: 1; min-height: 0; overflow: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px\">\n          <sc-if value=\"{{hasGField}}\">\n            <section style=\"border: 1px solid #98a3b6; border-radius: 10px; background: #ffffff; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px\">\n              <div style=\"font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: #6b7383\">Selected field<\u002Fdiv>\n              <div style=\"font-size: 14px; font-weight: 600\">{{gField.title}}<\u002Fdiv>\n              <p style=\"margin: 0; font-size: 12px; line-height: 1.55; color: #2c3547\">{{gField.text}}<\u002Fp>\n              <sc-if value=\"{{gField.hasEx}}\"><p style=\"margin: 0; font-size: 12px; line-height: 1.5; color: #44506a; background: #f3f5f9; border-radius: 6px; padding: 6px 8px\">Example: {{gField.ex}}<\u002Fp><\u002Fsc-if>\n              <div style=\"display: flex; gap: 8px; align-items: center; font-size: 11px; color: #6b7383\">\n                <span style=\"flex: 1\">{{gField.ref}}<\u002Fspan>\n                <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px\">{{gField.doc}}<\u002Fspan>\n              <\u002Fdiv>\n              <sc-if value=\"{{aiOn}}\"><button sc-camel-on-click=\"{{askAboutField}}\" style=\"align-self: flex-start; height: 28px; border: 1px solid #c3cad6; border-radius: 6px; background: #ffffff; padding: 0 10px; font-size: 12px; color: #2c3547\">Ask the assistant about this field →<\u002Fbutton><\u002Fsc-if>\n            <\u002Fsection>\n          <\u002Fsc-if>\n          <section style=\"display: flex; flex-direction: column; gap: 8px\">\n            <h3 style=\"margin: 0; font-size: 12px; font-weight: 600\">About this view<\u002Fh3>\n            <sc-for list=\"{{guideItems}}\" as=\"gi\" hint-placeholder-count=\"2\"><p style=\"margin: 0; font-size: 12px; line-height: 1.55; color: #2c3547\">{{gi.text}}<\u002Fp><\u002Fsc-for>\n          <\u002Fsection>\n          <sc-if value=\"{{hasGFields}}\">\n            <section style=\"display: flex; flex-direction: column; gap: 4px\">\n              <h3 style=\"margin: 0 0 4px; font-size: 12px; font-weight: 600\">Fields in this view<\u002Fh3>\n              <sc-for list=\"{{gFields}}\" as=\"gf\" hint-placeholder-count=\"4\">\n                <button sc-camel-on-click=\"{{gf.onPick}}\" style=\"{{gf.style}}\">\n                  <span style=\"font-size: 12px; font-weight: 600\">{{gf.title}}<\u002Fspan>\n                  <span style=\"font-size: 11px; color: #5b6474; line-height: 1.4\">{{gf.short}}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fsection>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"padding: 10px 16px; border-top: 1px solid #dde2ea; font-size: 10px; color: #6b7383; line-height: 1.5\">Curated texts, paraphrased with clause references (ISO/SAE 21434:2021). Built from docs/guidance/*.md.<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{gtabAi}}\">\n          <sc-if value=\"{{aiOff}}\">\n            <div style=\"flex: 1; padding: 18px 16px; font-size: 12px; color: #5b6474; line-height: 1.55\">The AI assistant is turned off for this project. Owners can enable it in Project settings › General. Project data is only sent to the configured model when it is enabled.<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{aiOn}}\">\n            <div style=\"padding: 10px 16px; border-bottom: 1px solid #eef0f4; display: flex; flex-direction: column; gap: 8px; background: #ffffff\">\n              <div style=\"display: flex; align-items: center; gap: 6px; flex-wrap: wrap\">\n                <span style=\"font-size: 11px; color: #6b7383\">Context<\u002Fspan>\n                <span style=\"display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 12px; background: #e1e6ed; font-size: 11px; font-weight: 600; color: #2c3547\">{{aiCtx}}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 6px\">\n                <sc-for list=\"{{aiActions}}\" as=\"aa\" hint-placeholder-count=\"2\">\n                  <button sc-camel-on-click=\"{{aa.onRun}}\" style=\"min-height: 30px; border: 1px solid #98a3b6; border-radius: 15px; background: #ffffff; padding: 0 12px; font-size: 12px; color: #2c3547\">{{aa.label}}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex: 1; min-height: 0; overflow: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 12px\">\n              <sc-if value=\"{{aiEmpty}}\">\n                <div style=\"font-size: 12px; color: #6b7383; line-height: 1.55\">Pick a quick action above or ask a question. The assistant sees only the context shown above. Suggestions are never applied without your click.<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-for list=\"{{aiMsgs}}\" as=\"am\" hint-placeholder-count=\"0\">\n                <div style=\"display: flex; flex-direction: column; gap: 6px\">\n                  <div style=\"align-self: flex-end; max-width: 90%; background: #44506a; color: #ffffff; border-radius: 10px 10px 2px 10px; padding: 6px 10px; font-size: 12px\">{{am.q}}<\u002Fdiv>\n                  <div style=\"border: 1px solid #dde2ea; border-radius: 10px; background: #ffffff; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px\">\n                    <div style=\"display: flex; align-items: center; gap: 6px\">\n                      <span style=\"font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 8px; border: 1px dashed #8e9ab1; color: #44506a\">AI
