name: taramisu-backend

x-postgres: &postgres
  image: postgres:17-alpine
  environment:
    POSTGRES_USER: taramisu
    POSTGRES_PASSWORD: taramisu
    POSTGRES_DB: taramisu
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U taramisu"]
    interval: 2s
    retries: 20

services:
  db:
    <<: *postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  dev-db:
    <<: *postgres
    profiles: [tools]

  migrate:
    image: arigaio/atlas:1.3.0
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgres://taramisu:taramisu@db:5432/taramisu?sslmode=disable
    command: ["migrate", "apply", "--env", "local"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    networks: [default, iam]
    environment:
      DATABASE_URL: postgres://taramisu:taramisu@db:5432/taramisu?sslmode=disable
      APP_URL: ${APP_URL:-http://localhost:8080}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://authentik.localhost:9000/application/o/taramisu/}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-taramisu}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

networks:
  iam:
    name: taramisu-auth
    external: true

volumes:
  postgres_data:
