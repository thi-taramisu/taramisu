x-postgres: &postgres
  image: postgres:17-alpine
  environment:
    POSTGRES_USER: taramisu
    POSTGRES_PASSWORD: taramisu
    POSTGRES_DB: taramisu
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U taramisu"]
    interval: 2s
    retries: 20

services:
  db:
    <<: *postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  dev-db:
    <<: *postgres
    profiles: [tools]

  pgadmin:
    image: dpage/pgadmin4:9
    profiles: [tools]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: taramisu
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    configs:
      - source: pgadmin_servers
        target: /pgadmin4/servers.json
      - source: pgadmin_pgpass
        target: /pgpass
        uid: "5050"
        gid: "5050"
        mode: 0600
    depends_on:
      db:
        condition: service_healthy

  migrate:
    image: arigaio/atlas:1.3.0
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgres://taramisu:taramisu@db:5432/taramisu?sslmode=disable
    command: ["migrate", "apply", "--env", "local"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment:
      DATABASE_URL: postgres://taramisu:taramisu@db:5432/taramisu?sslmode=disable
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

configs:
  pgadmin_servers:
    content: |
      {"Servers": {"1": {"Name": "taramisu (compose)", "Group": "Servers", "Host": "db", "Port": 5432, "MaintenanceDB": "taramisu", "Username": "taramisu", "SSLMode": "prefer", "PassFile": "/pgpass"}}}
  pgadmin_pgpass:
    content: |
      db:5432:taramisu:taramisu:taramisu

volumes:
  postgres_data:
  pgadmin_data:
