x-postgres: &postgres
  image: postgres:17-alpine
  environment:
    POSTGRES_USER: taramisu
    POSTGRES_PASSWORD: taramisu
    POSTGRES_DB: taramisu
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U taramisu"]
    interval: 2s
    retries: 20

services:
  db:
    <<: *postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  dev-db:
    <<: *postgres
    profiles: [tools]

  migrate:
    image: arigaio/atlas:1.3.0
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgres://taramisu:taramisu@db:5432/taramisu?sslmode=disable
    command: ["migrate", "apply", "--env", "local"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment:
      DATABASE_URL: postgres://taramisu:taramisu@db:5432/taramisu?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
