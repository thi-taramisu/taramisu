# Local documentation preview only. Does not replace the team's Compose bundle.
services:
  docs:
    build:
      context: ..
      dockerfile: docs-site/Dockerfile
      args:
        DOCS_SITE_URL: ${DOCS_SITE_URL:-http://localhost:8080}
        DOCS_REPOSITORY_URL: ${DOCS_REPOSITORY_URL:-}
    ports:
      - "127.0.0.1:8080:80"
