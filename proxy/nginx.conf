map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      "";
}

resolver 127.0.0.11 valid=2s ipv6=off;

upstream api_backend {
  zone api_backend 64k;
  least_conn;
  # Passive health check (NGINX defaults, made explicit): one failed attempt marks a replica down for fail_timeout.
  # deploy/stack_test.py reads fail_timeout to time its resolver pruning check.
  server api:8080 resolve max_fails=1 fail_timeout=10s;
}

upstream authentik_backend {
  zone authentik_backend 64k;
  server authentik-server:9000 resolve;
}

log_format upstream_logging '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" "$http_x_forwarded_for" '
                            'upstream: $upstream_addr status: $upstream_status '
                            'response_time: $upstream_response_time';

server {
  listen 80;
  access_log /var/log/nginx/access.log upstream_logging;
  client_max_body_size 25m;

  proxy_http_version 1.1;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # The backend serves /api/v1 and /health itself; preserve the complete request URI and load-balance across replicas.
  location /api/v1/ {
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_pass http://api_backend;
  }

  location /health/ {
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_pass http://api_backend;
  }

  # Backend Swagger UI, OpenAPI specification, and JSON schemas.
  location = /api/docs {
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_pass http://api_backend/docs;
  }

  location = /api/docs/ {
    return 308 /api/docs;
  }

  location ~ ^/openapi(-3\.0)?\.(json|yaml)$ {
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_pass http://api_backend;
  }

  location /schemas/ {
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_pass http://api_backend;
  }

  # SPA OIDC PKCE callback route served by the frontend bundle.
  location = /auth/callback {
    proxy_pass http://frontend:80;
  }

  location = /auth {
    return 308 /auth/;
  }

  # Authentik runs under AUTHENTIK_WEB__PATH=/auth/ and handles all /auth/* endpoints.
  location /auth/ {
    proxy_connect_timeout 2s;
    proxy_pass http://authentik_backend;
  }

  # Authentik's AdminInterface/UserInterface client-side redirects use root-relative /if/* and /flows/* paths.
  location /if/ {
    return 302 /auth$request_uri;
  }

  location /flows/ {
    return 302 /auth$request_uri;
  }

  location = /docs {
    return 308 /docs/;
  }

  location /docs/ {
    proxy_pass http://docs:80;
  }

  location / {
    proxy_pass http://frontend:80;
  }
}
