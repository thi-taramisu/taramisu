# Docker Default DNS so nginx can reslove services' names and get their IP addresses
resolver 127.0.0.11 valid=10s ipv6=off;
# For WebSockets, it updates the connection to upgrade (Needed for Authentik)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}
upstream api_backend {
  zone api_backend 64k; 
  least_conn;
  # max fails and fail_timeout for the passive health check
  server api:8080 resolve max_fails=3 fail_timeout=15s;
  keepalive 30;
}

upstream frontend {
  zone frontend 64k;
  server frontend:80 resolve;
  keepalive 10;
}

upstream authentik {
    zone authentik 64k;
    server authentik-server:9000 resolve; 
    keepalive 10;
}
# Redirect HTTP to HTTPS
server {
    listen 80 default_server;
    server_name _;
    # Response for the healthcheck
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/ssl/certs/cert.pem;
    ssl_certificate_key /etc/ssl/private/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # So users can upload images (Default is 1MB)
    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Routing
    location /api/v1/ {
        proxy_pass http://api_backend; 

        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 15s;

        # stream responses immediately instead of buffering
        proxy_buffering    off;
        proxy_cache        off;
        gzip               off; # compression buffers event streams
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://frontend;
    }

    location /auth/ {
        proxy_pass http://authentik; 
    }

    location = /docs {
    return 308 /docs/;
  }

  location /docs/ {
    proxy_pass http://docs:80;
  }
}
server {
    listen 443 ssl;
    http2 on;
    server_name authentik.localhost;

    ssl_certificate     /etc/ssl/certs/cert.pem;
    ssl_certificate_key /etc/ssl/private/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    location / {
        proxy_pass http://authentik;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets (Authentik's outpost and UI use them)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}