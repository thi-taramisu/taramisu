name: Lint

# Central lint workflow. Every component (docs, frontend, backend, ...) gets its own job, gated by a
# path filter so only affected components are linted. All jobs run in parallel.
#
# Branch protection: mark only the "Lint result" job as required. It aggregates all component jobs,
# so jobs skipped by the path filter do not block merging.

on:
  # No branch filter: stacked PRs (base != main) must be checked as well.
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PRs, but let every run on main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists PR files via the API
    outputs:
      markdown: ${{ steps.filter.outputs.markdown }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            markdown:
              - '**/*.md'
              - '.markdownlint.yaml'
              - '.markdownlint-cli2.yaml'
              - '.github/workflows/lint.yml'

  markdown:
    name: Markdown
    needs: changes
    # Outside of PRs (push to main, manual run) everything is linted as a safety net.
    if: needs.changes.outputs.markdown == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run markdownlint-cli2
        # File selection (globs, ignores) and rules come from .markdownlint-cli2.yaml / .markdownlint.yaml,
        # so CI, local CLI and the VS Code extension behave identically.
        uses: DavidAnson/markdownlint-cli2-action@v24

  result:
    name: Lint result
    if: always()
    needs:
      - changes
      - markdown
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Generate lint summary
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## 🔍 Lint Results Summary

          | Component | Status | Tool |
          | :--- | :---: | :--- |
          | **Changes Detection** | ${{ needs.changes.result == 'success' && '✅ Succeeded' || '❌ Failed' }} | `dorny/paths-filter` |
          | **Markdown** | ${{ needs.markdown.result == 'success' && '✅ Passed' || (needs.markdown.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} | `markdownlint-cli2` |
          EOF

      - name: Check job results
        if: |
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          needs.changes.result != 'success'
        run: |
          echo "At least one lint job failed or was cancelled, or changes detection did not succeed."
          exit 1