name: Documentation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-build:
    name: docs-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs-site
    env:
      DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL || 'http://localhost:3001' }}
      DOCS_BASE_URL: ${{ vars.DOCS_BASE_URL || '/' }}
      DOCS_REPOSITORY_URL: https://github.com/${{ github.repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: docs-site/.nvmrc
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check configuration types
        run: npm run typecheck
      - name: Build external documentation
        run: npm run build
      - name: Store static website
        uses: actions/upload-artifact@v7
        with:
          name: taramisu-external-docs
          path: docs-site/build/
          if-no-files-found: error
          retention-days: 7
