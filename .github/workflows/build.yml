name: Build and Test

# Central build & test workflow. Every component (frontend, backend, docs-site, ...) gets its own job,
# gated by a path filter so only affected components are built and tested. All jobs run in parallel.
#
# Branch protection: mark only the "Build result" job as required. It aggregates all component jobs,
# so jobs skipped by the path filter do not block merging.

on:
  # No branch filter: stacked PRs (base != main) must be checked as well.
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PRs, but let every run on main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists PR files via the API
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/build.yml'

  frontend:
    name: Frontend
    needs: changes
    # Outside of PRs (push to main, manual run) everything is built and tested as a safety net.
    if: needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit & component tests with coverage
        run: npm run test:coverage

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Report frontend test & coverage summary
        if: always() && steps.install.outcome == 'success'
        run: |
          node -e '
            const fs = require("fs");
            let md = "### 🧪 Frontend Test & Coverage Summary\n\n";
            try {
              const cov = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8")).total;
              md += "| Metric | Covered | Total | Percentage | Minimum Threshold |\n";
              md += "| :--- | :---: | :---: | :---: | :---: |\n";
              md += `| **Lines** | ${cov.lines.covered} | ${cov.lines.total} | ${cov.lines.pct}% | 80% |\n`;
              md += `| **Statements** | ${cov.statements.covered} | ${cov.statements.total} | ${cov.statements.pct}% | 80% |\n`;
              md += `| **Functions** | ${cov.functions.covered} | ${cov.functions.total} | ${cov.functions.pct}% | 80% |\n`;
              md += `| **Branches** | ${cov.branches.covered} | ${cov.branches.total} | ${cov.branches.pct}% | 80% |\n\n`;
            } catch (e) {
              md += "_Coverage report not generated._\n\n";
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          '

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload production build artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  result:
    name: Build result
    if: always()
    needs:
      - changes
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Generate build summary
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## 🏗️ Build & Test Results Summary

          | Component | Status | Details |
          | :--- | :---: | :--- |
          | **Changes Detection** | ${{ needs.changes.result == 'success' && '✅ Succeeded' || '❌ Failed' }} | `dorny/paths-filter` |
          | **Frontend** | ${{ needs.frontend.result == 'success' && '✅ Passed' || (needs.frontend.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} | Typecheck, Vitest (V8 Coverage), Build & Playwright E2E |
          EOF

      - name: Check job results
        if: |
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          needs.changes.result != 'success'
        run: |
          echo "At least one build or test job failed or was cancelled, or changes detection did not succeed."
          exit 1
