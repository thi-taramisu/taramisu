name: Build and Test

# Central build & test workflow. Every component (frontend, backend, docs-site, ...) gets its own job,
# gated by a path filter so only affected components are built and tested. All jobs run in parallel.
#
# Branch protection: mark only the "Build result" job as required. It aggregates all component jobs,
# so jobs skipped by the path filter do not block merging.

on:
  # No branch filter: stacked PRs (base != main) must be checked as well.
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PRs, but let every run on main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists PR files via the API
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/build.yml'

  frontend:
    name: Frontend
    needs: changes
    # Outside of PRs (push to main, manual run) everything is built and tested as a safety net.
    if: needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit & component tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Upload production build artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  result:
    name: Build result
    if: always()
    needs:
      - changes
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check job results
        if: |
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          needs.changes.result != 'success'
        run: |
          echo "At least one build or test job failed or was cancelled, or changes detection did not succeed."
          exit 1
